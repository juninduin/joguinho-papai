<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joguinho Papai</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="img/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="img/icons/icon-512.png">
<link rel="apple-touch-icon" href="img/icons/icon-180.png">
<meta name="theme-color" content="#3D348B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#EAF4FB;
    --card:#FFFFFF;
    --coral:#FF8B67;
    --yellow:#FFD166;
    --mint:#06D6A0;
    --plum:#3D348B;
    --plum-soft:#6C63AC;
    --ink:#2C2A4A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 12% 15%, #DCEEFB 0%, transparent 40%),
      radial-gradient(circle at 88% 80%, #FDE9DC 0%, transparent 45%),
      var(--sky);
    transition:background .5s ease;
    font-family:'Quicksand', sans-serif;
    color:var(--ink);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:24px 16px 100px;
  }
  h1,h2,h3,.display{ font-family:'Baloo 2', cursive; }
  .app{ width:100%; max-width:520px; position:relative; z-index:2; }
  @media (min-width:1000px){ .app{ max-width:760px; } .puzzle-grid{ max-width:500px !important; } }
  img.emoji{ height:1.1em; width:1.1em; margin:0 .04em 0 .08em; vertical-align:-0.2em; }

  header.top{
    position:relative;
    text-align:center; margin-bottom:16px;
    background:linear-gradient(160deg, #ffffff 0%, #F8F7FD 100%);
    border-radius:26px; padding:22px 18px 20px;
    box-shadow:0 14px 30px rgba(61,52,139,0.10);
  }
  .mascot-wrap{ display:flex; justify-content:center; margin-bottom:6px; position:relative; }
  .mascot-wrap::before{
    content:''; position:absolute; top:50%; left:50%; width:118px; height:118px;
    background:radial-gradient(circle, rgba(255,209,102,0.4) 0%, transparent 72%);
    border-radius:50%; transform:translate(-50%,-50%); z-index:0;
  }
  .mascot{
    width:88px; height:88px;
    border-radius:50% 50% 46% 46% / 55% 55% 45% 45%;
    background:var(--yellow);
    position:relative; z-index:1;
    transition:background .4s ease, transform .3s ease;
    box-shadow:0 10px 0 rgba(61,52,139,0.12), 0 14px 22px rgba(61,52,139,0.14);
  }
  .mascot::before, .mascot::after{
    content:""; position:absolute; top:34px; width:11px; height:14px;
    background:var(--ink); border-radius:50%; transition:all .3s ease;
  }
  .mascot::before{ left:24px; }
  .mascot::after{ right:24px; }
  .mascot .mouth{
    position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
    width:28px; height:16px; border-bottom:5px solid var(--ink); border-radius:0 0 26px 26px;
    transition:all .3s ease;
  }
  .mascot .cheek{ position:absolute; bottom:26px; width:11px; height:6px; background:rgba(255,255,255,0.55); border-radius:50%; }
  .mascot .cheek.l{ left:12px; } .mascot .cheek.r{ right:12px; }

  .mascot.feliz{ background:var(--yellow); }
  .mascot.triste{ background:#8EC5E8; }
  .mascot.triste .mouth{ border-bottom:none; border-top:5px solid var(--ink); border-radius:26px 26px 0 0; bottom:16px; }
  .mascot.bravo{ background:#FF6B6B; }
  .mascot.bravo::before{ transform:rotate(20deg); }
  .mascot.bravo::after{ transform:rotate(-20deg); }
  .mascot.bravo .mouth{ border-radius:0; height:5px; width:24px; }
  .mascot.medo{ background:#B79CED; }
  .mascot.medo .mouth{ width:16px; height:16px; border-radius:50%; border:none; background:var(--ink); bottom:18px; }
  .mascot.surpreso{ background:#6FD6C9; }
  .mascot.surpreso .mouth{ width:20px; height:20px; border-radius:50%; border:none; background:var(--ink); bottom:17px; }
  .mascot.calmo{ background:#A8E6B8; }
  .mascot.vergonha{ background:#FFB4C6; }
  .mascot.animado{ background:#FF9F5A; transform:scale(1.05) rotate(-3deg); }

  header.top h1{ font-size:1.55rem; color:var(--plum); margin:8px 0 2px; letter-spacing:0.2px; }
  header.top p{ margin:0; color:var(--plum-soft); font-weight:600; font-size:0.92rem; }

  .stars-badge{
    display:inline-flex; align-items:center; gap:6px;
    background:linear-gradient(135deg, #FFF6E0, #FFEAC2); color:#A8720B; font-weight:700;
    border-radius:20px; padding:7px 16px; margin-top:12px;
    font-family:'Baloo 2', cursive; font-size:0.95rem;
    box-shadow:0 6px 14px rgba(184,134,11,0.18);
  }

  .card{
    background:var(--card); border-radius:26px; padding:20px 18px 24px;
    box-shadow:0 14px 30px rgba(61,52,139,0.10);
  }
  .step-title{ text-align:center; font-size:1.2rem; color:var(--plum); margin:0 0 4px; }
  .step-sub{ text-align:center; color:var(--plum-soft); font-weight:600; font-size:0.88rem; margin:0 0 16px; }

  /* ONBOARDING */
  .greeting-row{ display:flex; align-items:center; justify-content:center; gap:8px; }
  .edit-name-btn{
    background:#F0EDFB; border:none; border-radius:50%; width:26px; height:26px;
    font-size:0.8rem; cursor:pointer; display:none; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .edit-name-btn.show{ display:flex; }
  .nav{ display:flex; justify-content:space-between; align-items:center; margin-top:20px; gap:10px; }
  input[type=text], input[type=number], textarea{
    width:100%; border:2px solid #E4DFF5; border-radius:14px; padding:12px 14px;
    font-family:'Quicksand', sans-serif; font-size:0.95rem; color:var(--ink); margin-top:6px;
    resize:none;
  }
  input[type=text]:focus, input[type=number]:focus, textarea:focus{ outline:2px solid var(--coral); border-color:transparent; }

  /* CAPA (primeiro acesso) — tela de titulo estilo jogo infantil */
  body.cover-mode{
    align-items:center; justify-content:center; padding:24px 16px; overflow:hidden; position:relative;
    background:
      radial-gradient(circle at 15% 15%, rgba(255,255,255,0.55) 0%, transparent 42%),
      radial-gradient(circle at 88% 12%, rgba(255,209,102,0.55) 0%, transparent 45%),
      radial-gradient(circle at 12% 88%, rgba(6,214,160,0.5) 0%, transparent 45%),
      radial-gradient(circle at 90% 85%, rgba(255,139,103,0.5) 0%, transparent 45%),
      linear-gradient(160deg, #FFE29A 0%, #FFB6D9 45%, #A6E8FF 100%);
  }
  body.cover-mode .app{ z-index:3; }
  .title-shape{
    position:absolute; border-radius:50%; pointer-events:none; z-index:1;
    background:rgba(255,255,255,0.6); animation:floatShape 6s ease-in-out infinite;
  }
  .title-shape.c-pink{ background:rgba(255,107,157,0.45); }
  .title-shape.c-yellow{ background:rgba(255,209,102,0.5); }
  .title-shape.c-mint{ background:rgba(6,214,160,0.4); }
  .title-emoji-shape{
    position:absolute; pointer-events:none; z-index:1; line-height:1;
    animation:floatShape 5.5s ease-in-out infinite; filter:drop-shadow(0 4px 6px rgba(31,22,74,0.18));
  }
  @keyframes floatShape{ 0%,100%{ transform:translateY(0) rotate(0deg); } 50%{ transform:translateY(-16px) rotate(6deg); } }
  .title-screen{ text-align:center; position:relative; z-index:2; }
  .title-mascot-wrap{ display:flex; justify-content:center; margin-bottom:2px; }
  .title-mascot{
    width:104px; height:104px; border-radius:50%; background:var(--yellow); position:relative;
    box-shadow:0 12px 0 rgba(31,22,74,0.12), 0 16px 26px rgba(31,22,74,0.25);
    animation:mascotBounce 1.8s ease-in-out infinite;
  }
  .title-mascot::before, .title-mascot::after{
    content:''; position:absolute; top:38px; width:11px; height:15px; background:var(--ink); border-radius:50%;
  }
  .title-mascot::before{ left:30px; } .title-mascot::after{ right:30px; }
  .title-mascot .t-mouth{
    position:absolute; left:50%; bottom:22px; transform:translateX(-50%);
    width:34px; height:17px; border-bottom:6px solid var(--ink); border-radius:0 0 26px 26px;
  }
  .title-mascot .t-cheek{ position:absolute; bottom:30px; width:14px; height:8px; background:rgba(255,255,255,0.6); border-radius:50%; }
  .title-mascot .t-cheek.l{ left:14px; } .title-mascot .t-cheek.r{ right:14px; }
  .title-mascot .t-controller{
    position:absolute; bottom:-10px; right:-16px; font-size:2rem;
    filter:drop-shadow(0 4px 6px rgba(31,22,74,0.25)); animation:controllerWiggle 1.8s ease-in-out infinite;
  }
  @keyframes mascotBounce{ 0%,100%{ transform:translateY(0) rotate(-4deg); } 50%{ transform:translateY(-14px) rotate(4deg); } }
  @keyframes controllerWiggle{ 0%,100%{ transform:rotate(-8deg); } 50%{ transform:rotate(8deg); } }
  .game-title{
    font-family:'Fredoka', 'Baloo 2', cursive; font-weight:700; font-size:3.1rem; line-height:1.05; margin:10px 0 0;
    letter-spacing:0.5px;
  }
  .game-title .w1{
    color:#FF6B9D; -webkit-text-stroke:4px #FFFFFF; paint-order:stroke fill;
    text-shadow:0 5px 0 #E8437A, 0 10px 0 rgba(232,67,122,0.4), 0 18px 22px rgba(31,22,74,0.3);
  }
  .game-title .w2{
    color:#FFD166; -webkit-text-stroke:4px #FFFFFF; paint-order:stroke fill;
    text-shadow:0 5px 0 #E0A800, 0 10px 0 rgba(224,168,0,0.4), 0 18px 22px rgba(31,22,74,0.3);
  }
  .game-tag{
    margin:12px 0 26px; font-family:'Fredoka', 'Baloo 2', cursive; font-weight:600; font-size:1.05rem;
    color:#FFFFFF; text-shadow:0 3px 0 rgba(61,52,139,0.35);
  }
  .play-btn{
    font-family:'Fredoka', 'Baloo 2', cursive; font-weight:700; font-size:1.4rem; color:white; border:none;
    background:linear-gradient(180deg, #7EE8B8 0%, var(--mint) 100%);
    padding:17px 48px; border-radius:999px; cursor:pointer; -webkit-tap-highlight-color:transparent;
    box-shadow:0 8px 0 #05A87D, 0 16px 26px rgba(31,22,74,0.3); transition:transform .12s ease, box-shadow .12s ease;
    animation:playPulse 1.6s ease-in-out infinite;
  }
  .play-btn:active{ transform:translateY(6px); box-shadow:0 2px 0 #05A87D, 0 6px 14px rgba(31,22,74,0.25); }
  @keyframes playPulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
  .dev-credit{
    margin:22px 0 0; font-family:'Quicksand', sans-serif; font-weight:700; font-size:0.72rem;
    letter-spacing:0.5px; color:#FFFFFF; text-shadow:0 2px 6px rgba(31,22,74,0.35); opacity:0.9;
  }

  /* PERFIL */
  .field-label{ display:block; font-family:'Baloo 2',cursive; color:var(--plum); font-size:0.82rem; margin:16px 0 2px; }
  .field-label:first-of-type{ margin-top:0; }
  .theme-row{ display:flex; gap:10px; margin:6px 0 4px; }
  .theme-swatch{
    width:38px; height:38px; border-radius:50%; border:3px solid transparent; cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,0.15); padding:0;
  }
  .theme-swatch.selected{ border-color:var(--ink); transform:scale(1.12); }

  /* ROTINA */
  .overall{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .overall-track{ flex:1; height:12px; background:#F0EDFB; border-radius:8px; overflow:hidden; }
  .overall-fill{ height:100%; background:linear-gradient(90deg,var(--coral),var(--yellow)); border-radius:8px; transition:width .35s ease; width:0%; }
  .overall-label{ font-family:'Baloo 2',cursive; font-size:0.85rem; color:var(--plum); white-space:nowrap; }

  .period-tabs{ display:flex; gap:8px; margin-bottom:16px; }
  .period-tab{
    flex:1; border:2px solid #E4DFF5; background:#F8F7FD; color:var(--plum-soft);
    font-family:'Baloo 2',cursive; font-weight:700; font-size:0.8rem; border-radius:14px;
    padding:10px 6px; cursor:pointer; text-align:center; transition:all .15s ease;
  }
  .period-tab span{ display:block; font-size:1.15rem; }
  .period-tab.active{ background:var(--coral); border-color:var(--coral); color:white; }
  .period-tab.locked{ opacity:0.5; cursor:not-allowed; }

  .period{ margin-bottom:18px; }
  .period-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .period-head .name{ font-family:'Baloo 2', cursive; color:var(--plum); font-size:1rem; display:flex; gap:6px; align-items:center; }
  .period-head .count{ background:#F0EDFB; color:var(--plum-soft); font-weight:700; font-size:0.78rem; padding:3px 10px; border-radius:12px; }

  .item{
    display:flex; align-items:center; gap:12px;
    background:#F8F7FD; border-radius:18px; padding:10px 12px; margin-bottom:9px;
    border:3px solid transparent; cursor:pointer; -webkit-tap-highlight-color:transparent;
    transition:border-color .15s ease, background .15s ease, opacity .15s ease;
  }
  .item.done{ background:#EFFBF5; border-color:var(--mint); opacity:0.85; }
  .item .icon{
    width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    font-size:1.4rem; flex-shrink:0;
  }
  .item .info{ flex:1; min-width:0; }
  .item .name{ font-weight:700; font-size:0.95rem; }
  .item.done .name{ text-decoration:line-through; text-decoration-color:var(--mint); }
  .item .time{ font-size:0.78rem; color:var(--plum-soft); font-weight:600; }
  .item .check{
    width:30px; height:30px; border-radius:50%; border:3px solid #DAD6F2; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:1rem; color:white;
    transition:all .2s ease;
  }
  .item.done .check{ background:var(--mint); border-color:var(--mint); }

  .praise-banner{
    text-align:center; background:#FFF1EA; color:var(--coral); font-family:'Baloo 2',cursive;
    font-weight:700; font-size:0.9rem; border-radius:16px; padding:12px; margin-top:6px;
  }

  /* NAV */
  .backbtn-header{
    position:absolute; top:0; left:0;
    width:40px; height:40px; border-radius:50%;
    background:var(--card); display:flex; align-items:center; justify-content:center;
    font-size:1.2rem; color:var(--plum); text-decoration:none;
    box-shadow:0 6px 14px rgba(61,52,139,0.10);
  }

  /* PUZZLE */
  .diff-toggle{ display:flex; gap:6px; margin-bottom:14px; }
  .diff-btn{
    flex:1; border:2px solid #E4DFF5; background:#F8F7FD; color:var(--plum-soft);
    font-family:'Baloo 2',cursive; font-weight:700; font-size:0.82rem; border-radius:12px;
    padding:8px; cursor:pointer;
  }
  .diff-btn.active{ background:var(--coral); border-color:var(--coral); color:white; }

  .puzzle-wrap{ display:flex; justify-content:center; margin-bottom:14px; }
  .puzzle-grid{
    display:grid; gap:5px; width:100%; max-width:340px; aspect-ratio:1/1;
    background:#E4DFF5; padding:5px; border-radius:18px;
  }
  .tile{
    border-radius:10px; cursor:pointer; background-repeat:no-repeat;
    border:3px solid transparent; transition:transform .12s ease, border-color .12s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .tile:active{ transform:scale(0.96); }
  .tile.picked{ border-color:var(--coral); transform:scale(0.97); }
  .tile.solved-flash{ border-color:var(--mint); }

  .puzzle-actions{ display:flex; gap:10px; margin-top:4px; }
  button.btn{
    font-family:'Baloo 2', cursive; font-size:0.95rem; border:none; border-radius:16px;
    padding:12px 18px; cursor:pointer; transition:transform .15s ease, opacity .15s;
  }
  button.btn:active{ transform:scale(0.96); }
  .btn-primary{ background:var(--coral); color:white; flex:1; }
  .btn-ghost{ background:#F0EDFB; color:var(--plum-soft); font-weight:700; flex:1; }
  .btn-danger{ background:#FFE3E3; color:#D64545; font-weight:700; }
  input[type=file]{ display:none; }

  /* EMOÇÃO */
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .opt{
    border:3px solid transparent; background:#F5F3FF; border-radius:18px; padding:14px 8px;
    text-align:center; cursor:pointer; font-family:'Baloo 2', cursive; font-size:1rem; color:var(--ink);
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
    display:flex; flex-direction:column; align-items:center; gap:6px; -webkit-tap-highlight-color:transparent;
  }
  .opt .emoji{ font-size:2.1rem; }
  .opt:active{ transform:scale(0.97); }
  .opt.selected{ border-color:var(--coral); background:#FFF1EA; }
  .single-col{ grid-template-columns:1fr; }
  .opt.wide{ flex-direction:row; justify-content:flex-start; padding:12px 10px; font-size:0.85rem; line-height:1.15; }
  .opt.wide .emoji{ font-size:1.4rem; flex-shrink:0; }

  .progress{ display:flex; justify-content:center; gap:6px; margin:0 0 16px; }
  .dot{ width:9px; height:9px; border-radius:50%; background:#DAD6F2; transition:background .2s ease, transform .2s ease; }
  .dot.active{ background:var(--coral); transform:scale(1.25); }

  .summary-line{
    display:flex; gap:10px; align-items:flex-start; background:#F8F7FD; border-radius:14px;
    padding:12px 14px; margin-bottom:10px;
  }
  .summary-line .label{ font-weight:700; color:var(--plum); font-family:'Baloo 2', cursive; font-size:0.85rem; min-width:78px; }
  .summary-line .val{ font-size:0.92rem; color:var(--ink); }

  .diary-entry{ background:#F8F7FD; border-radius:16px; padding:14px 16px; margin-bottom:10px; }
  .diary-entry .date{ font-family:'Baloo 2', cursive; color:var(--plum); font-size:0.85rem; margin-bottom:4px; }
  .diary-entry .row{ font-size:0.88rem; margin:2px 0; }
  .diary-entry .row b{ color:var(--plum-soft); }
  .empty{ text-align:center; color:var(--plum-soft); font-weight:600; padding:20px 0; }
  .top-link{
    display:block; text-align:center; margin-top:14px; color:var(--plum-soft);
    font-weight:700; font-size:0.85rem; cursor:pointer; text-decoration:underline;
  }

  /* TROFÉUS */
  .stat-card{
    display:flex; align-items:center; gap:14px; background:#F8F7FD; border-radius:18px;
    padding:16px; margin-bottom:12px;
  }
  .stat-card .ic{ font-size:2rem; }
  .stat-card .num{ font-family:'Baloo 2',cursive; color:var(--plum); font-size:1.4rem; }
  .stat-card .lbl{ font-size:0.82rem; color:var(--plum-soft); font-weight:600; }

  /* WIN MODAL + CONFETTI */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(44,42,74,0.45);
    display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal-overlay.show{ display:flex; }
  .modal-card{
    background:white; border-radius:26px; padding:32px 26px; text-align:center;
    max-width:320px; width:100%; box-shadow:0 20px 50px rgba(0,0,0,0.25);
    animation:popIn .35s ease;
  }
  @keyframes popIn{ from{ transform:scale(0.7); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .modal-emoji{ font-size:3rem; margin-bottom:6px; }
  .modal-card h2{ color:var(--plum); margin:4px 0 8px; font-size:1.4rem; }
  .modal-card p{ color:var(--plum-soft); font-weight:600; font-size:0.92rem; margin:0 0 18px; }

  .confetti-container{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:101; }
  .confetti-piece{
    position:absolute; top:-20px; border-radius:2px;
    animation-name:confetti-fall; animation-timing-function:linear; animation-fill-mode:forwards;
  }
  @keyframes confetti-fall{ to{ transform:translateY(110vh) rotate(720deg); opacity:0.9; } }

  /* alvos de toque maiores para tablet/celular na escola */
  .item{ min-height:44px; }
  .check{ width:34px; height:34px; }
  .opt{ min-height:44px; }
  button.btn{ min-height:46px; }
  .edit-name-btn{ width:30px; height:30px; }

  /* telas maiores (tablet paisagem / desktop) aproveitam melhor o espaço */
  @media (min-width: 700px){
    body{ padding:40px 24px 110px; }
    .app{ max-width:640px; }
    header.top h1{ font-size:1.8rem; }
    header.top p{ font-size:1rem; }
    .card{ padding:28px 30px 32px; }
    .step-title{ font-size:1.4rem; }
    .step-sub{ font-size:0.98rem; }
    .item .name{ font-size:1.02rem; }
    .item .time{ font-size:0.84rem; }
    .opt{ font-size:1.05rem; padding:18px 10px; }
    .opt .emoji{ font-size:2.3rem; }
    .puzzle-grid{ max-width:420px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top" id="pageHeader">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* ---------- storage helper (funciona dentro ou fora da plataforma) ---------- */
const store = {
  async set(key, value){
    try{ if(window.storage){ await window.storage.set(key, value, false); return; } }catch(e){}
    try{ localStorage.setItem(key, value); }catch(e){}
  },
  async get(key){
    try{
      if(window.storage){
        const r = await window.storage.get(key, false);
        if(r && r.value !== undefined && r.value !== null) return r.value;
      }
    }catch(e){}
    try{ return localStorage.getItem(key); }catch(e){ return null; }
  },
  async remove(key){
    try{ if(window.storage){ await window.storage.set(key, '', true); } }catch(e){}
    try{ localStorage.removeItem(key); }catch(e){}
  },
  async list(prefix){
    try{
      if(window.storage){
        const r = await window.storage.list(prefix, false);
        if(r && r.keys) return r.keys;
      }
    }catch(e){}
    try{ return Object.keys(localStorage).filter(k=>k.startsWith(prefix)); }catch(e){ return []; }
  }
};

function todayKey(){ return new Date().toISOString().slice(0,10); }

/* ---------- backup na nuvem (Supabase) ---------- */
/* Usa só a chave anon (pública) + login anônimo. As regras de segurança (RLS)
   no banco garantem que cada aparelho só lê/escreve os próprios dados.
   Funciona por trás dos panos: se não tiver internet, essas chamadas
   simplesmente falham em silêncio e o jogo continua 100% funcional local. */
const SUPABASE_URL = ''; // cole aqui a URL do NOVO projeto Supabase desta cópia
const SUPABASE_ANON_KEY = ''; // cole aqui a chave "anon public" do NOVO projeto

const sb = (window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
let deviceId = null;
let cloudSessionPromise = null;

function ensureCloudSession(){
  if(!sb) return Promise.resolve(null);
  if(deviceId) return Promise.resolve(deviceId);
  if(cloudSessionPromise) return cloudSessionPromise;
  cloudSessionPromise = (async ()=>{
    try{
      const { data:{ session } } = await sb.auth.getSession();
      if(session && session.user){ deviceId = session.user.id; return deviceId; }
      const { data, error } = await sb.auth.signInAnonymously();
      if(error || !data.user) return null;
      deviceId = data.user.id;
      return deviceId;
    }catch(e){ return null; }
    finally{ cloudSessionPromise = null; }
  })();
  return cloudSessionPromise;
}

async function cloudSyncProfile(){
  if(!sb) return;
  if(!deviceId) await ensureCloudSession();
  if(!deviceId) return;
  try{
    await sb.from('profiles').upsert({
      device_id: deviceId,
      nome: profileName,
      idade: profileExtra.idade,
      tema: profileExtra.tema,
      avatar: profileExtra.avatar,
      estrelas_total: starTotal,
      quebra_grid: gridSize,
      quebra_imagem: puzzleImg,
      quebra_resolvidos_total: puzzlesSolvedTotal,
      atualizado_em: new Date().toISOString(),
    });
  }catch(e){}
}

async function cloudSyncRotina(){
  if(!sb) return;
  if(!deviceId) await ensureCloudSession();
  if(!deviceId) return;
  try{
    const premiada = !!(await store.get('rotina-premiada:' + todayKey()));
    await sb.from('rotina_dias').upsert({
      device_id: deviceId,
      data: todayKey(),
      itens_concluidos: done,
      estrela_premiada: premiada,
      atualizado_em: new Date().toISOString(),
    }, { onConflict: 'device_id,data' });
  }catch(e){}
}

async function cloudSyncEmocao(entry){
  if(!sb) return;
  if(!deviceId) await ensureCloudSession();
  if(!deviceId) return;
  try{
    await sb.from('emocoes_diario').insert({
      device_id: deviceId,
      data: entry.date,
      emocao_emoji: entry.emotionEmoji,
      emocao_label: entry.emotionLabel,
      reacao: entry.reaction,
      solucao: entry.solution,
    });
  }catch(e){}
}

/* ---------- sons (sintetizados na hora, sem arquivo, funciona offline) ---------- */
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
  return audioCtx;
}
function playTone(freq, startTime, duration, type, peakGain){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'triangle';
  osc.frequency.value = freq;
  const t0 = ctx.currentTime + startTime;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peakGain || 0.14, t0 + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.02);
}
function playClickSound(){ playTone(680, 0, 0.09, 'triangle', 0.1); }
function playSuccessSound(){
  [523.25, 659.25, 783.99, 1046.5].forEach((f,i)=> playTone(f, i*0.09, 0.22, 'triangle', 0.13));
}
function playStartSound(){
  [392, 587.33].forEach((f,i)=> playTone(f, i*0.09, 0.2, 'triangle', 0.13));
}

    el.textContent = s.emoji;
    document.body.appendChild(el);
  });
  const cardArea = document.getElementById('cardArea');
  cardArea.classList.remove('cover-card', 'card');
  cardArea.innerHTML = `
    <div class="title-screen">
      <div class="title-mascot-wrap">

          <span class="t-cheek l"></span><span class="t-cheek r"></span><span class="t-mouth"></span>
          <span class="t-controller">🎮</span>
        </div>
      </div>
      <h1 class="game-title"><span class="w1">Joguinho</span><br><span class="w2">Papai</span></h1>
      <p class="game-tag">Um montão de joguinhos pra brincar! ✨</p>
      <button class="play-btn" id="startBtn">▶ Jogar</button>
      <p class="dev-credit">Desenvolvido por JUNIN DUIN DEV</p>
    </div>
  `;
  const confirmStart = async ()=>{
    if(!profileName){
      profileName = 'Jogador';
      await store.set('perfil:nome', profileName);
      cloudSyncProfile();
    }
    try{ sessionStorage.setItem('joguinho_session_started', '1'); }catch(e){}
    playStartSound();
    window.location.replace('menu.html');
  };
  document.getElementById('startBtn').onclick = confirmStart;
}

let done = {}; // id -> bool, for today
let activePeriod = null; // 'manha' | 'tarde' | 'noite'

async function loadRotinaState(){
  const raw = await store.get('rotina:' + todayKey());
  done = raw ? JSON.parse(raw) : {};
}

async function saveDone(){
  await store.set('rotina:' + todayKey(), JSON.stringify(done));
  cloudSyncRotina();
}

function allItemsFlat(){
  return ROUTINE.flatMap(p => p.items);
}

function isPeriodDone(period){
  return period.items.every(i => done[i.id]);
}

function isPeriodUnlocked(periodKey){
  const idx = ROUTINE.findIndex(p => p.period === periodKey);
  if(idx <= 0) return true;
  for(let i=0;i<idx;i++){
    if(!isPeriodDone(ROUTINE[i])) return false;
  }
  return true;
}

function pickDefaultPeriod(){
  for(const p of ROUTINE){
    if(!isPeriodDone(p)) return p.period;
  }
  return ROUTINE[ROUTINE.length-1].period;
}

async function toggleItem(id){
  done[id] = !done[id];
  playClickSound();
  await saveDone();

  const all = allItemsFlat();
  const doneCount = all.filter(i => done[i.id]).length;
  if(doneCount === all.length){
    const awardedKey = 'rotina-premiada:' + todayKey();
    const already = await store.get(awardedKey);
    if(!already){
      await addStar();
      await store.set(awardedKey, '1');
    }
  }
  renderRotina();
}

async function resetTodayRoutine(){
  done = {};
  await store.remove('rotina-premiada:' + todayKey());
  await saveDone();
  activePeriod = 'manha';
}

function renderRotina(){
  document.getElementById('subheader').textContent = 'Vamos ver a sua rotina de hoje?';
  setMascotMood(null);

  if(!activePeriod || !isPeriodUnlocked(activePeriod)){
    activePeriod = pickDefaultPeriod();
  }

  const all = allItemsFlat();
  const doneCount = all.filter(i => done[i.id]).length;
  const pct = all.length ? Math.round((doneCount/all.length)*100) : 0;
  const complete = doneCount === all.length;
  const period = ROUTINE.find(p => p.period === activePeriod);
  const pDone = period.items.filter(i => done[i.id]).length;
  const periodIdx = ROUTINE.findIndex(p => p.period === activePeriod);
  const isLastPeriod = periodIdx === ROUTINE.length - 1;

  let html = `
    <h2 class="step-title">Minha rotina de hoje 📅</h2>
    <p class="step-sub">Toque em cada tarefa quando terminar</p>
    <div class="overall">
      <div class="overall-track"><div class="overall-fill" style="width:${pct}%"></div></div>
      <div class="overall-label">${doneCount}/${all.length}</div>
    </div>
    <div class="period-tabs" id="periodTabs"></div>
    <div class="period-head">
      <span class="name">${period.emoji} ${period.label}</span>
      <span class="count">${pDone}/${period.items.length}</span>
    </div>
  `;

  period.items.forEach(item => {
    const isDone = !!done[item.id];
    html += `
      <div class="item ${isDone?'done':''}" data-id="${item.id}">
        <div class="icon" style="background:${item.bg}">${item.icon}</div>
        <div class="info">
          <div class="name">${item.name}</div>
          <div class="time">🕐 ${item.time}</div>
        </div>
        <div class="check">${isDone ? '✓' : ''}</div>
      </div>`;
  });

  if(pDone === period.items.length && !isLastPeriod){
    html += `<div class="praise-banner">✅ ${period.label} completa! A próxima parte foi liberada.</div>`;
  }

  if(complete){
    html += `
      <div class="praise-banner">
        🎉 Rotina completa! Você ganhou uma estrela para o quebra-cabeça!
        <div style="margin-top:10px;"><button class="btn btn-ghost" id="replayBtn" style="width:100%">🔄 Fazer de novo</button></div>
      </div>`;
  }

  const cardArea = document.getElementById('cardArea');
  cardArea.innerHTML = html;

  const tabsEl = document.getElementById('periodTabs');
  ROUTINE.forEach(p=>{
    const unlocked = isPeriodUnlocked(p.period);
    const btn = document.createElement('button');
    btn.className = 'period-tab' + (p.period===activePeriod ? ' active':'') + (unlocked ? '' : ' locked');
    btn.innerHTML = `<span>${p.emoji}</span>${p.label}${unlocked ? '' : ' 🔒'}`;
    btn.disabled = !unlocked;
    btn.onclick = ()=>{ activePeriod = p.period; renderRotina(); };
    tabsEl.appendChild(btn);
  });

  cardArea.querySelectorAll('.item').forEach(el=>{
    el.onclick = () => toggleItem(el.dataset.id);
  });
  const replayBtn = document.getElementById('replayBtn');
  if(replayBtn) replayBtn.onclick = async ()=>{ await resetTodayRoutine(); renderRotina(); };
  parseEmoji();
}

async function loadPuzzleState(){

function shuffle(arr){
  const a = arr.slice();
  do{
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
  }while(isSolved(a) && a.length>1);
  return a;
}

function isSolved(arr){
  return arr.every((v,i)=>v===i);
}

function newPuzzle(){
  const n = gridSize*gridSize;
  order = shuffle([...Array(n).keys()]);
  pickedSlot = null;
  solved = false;
  renderQuebra();
}

async function chooseDifficulty(size){
  gridSize = size;
  await store.set('quebra:grid', String(size));
  cloudSyncProfile();
  newPuzzle();
}

function resizeImageToDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const size = 480;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const side = Math.min(img.width, img.height);
        const sx = (img.width - side)/2;
        const sy = (img.height - side)/2;
        ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function onPhotoChosen(file){
  if(!file) return;
  try{
    const dataUrl = await resizeImageToDataUrl(file);
    puzzleImg = dataUrl;
    await store.set('quebra:imagem', dataUrl);
    cloudSyncProfile();
    newPuzzle();
  }catch(err){
    console.error('Erro ao carregar foto', err);
  }
}

async function pickTile(slot){
  if(solved) return;
  playClickSound();
  if(pickedSlot === null){
    pickedSlot = slot;
    renderQuebra();
    return;
  }
  if(pickedSlot === slot){
    pickedSlot = null;
    renderQuebra();
    return;
  }
  const tmp = order[pickedSlot];
  order[pickedSlot] = order[slot];
  order[slot] = tmp;
  pickedSlot = null;

  if(isSolved(order)){
    solved = true;
    await addStar();
    puzzlesSolvedTotal += 1;
    await store.set('quebra:resolvidos:total', String(puzzlesSolvedTotal));
    cloudSyncProfile();
    renderQuebra();
    triggerConfetti();
    showWinModal();
    return;
  }
  renderQuebra();
}

  for(let i=0;i<60;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const size = 6 + Math.random()*6;
    el.style.width = size + 'px';
    el.style.height = (size*0.4) + 'px';
    el.style.left = (Math.random()*100) + 'vw';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDuration = (2.2 + Math.random()*1.6) + 's';

    <div class="summary-line"><span class="label">Senti</span><span class="val">${emo.emoji} ${emo.label}</span></div>
    <div class="summary-line"><span class="label">Eu fiz</span><span class="val">${emoState.reaction || emoState.reactionCustom}</span></div>
    <div class="summary-line"><span class="label">Da próxima vez</span><span class="val">${emoState.solution || emoState.solutionCustom}</span></div>
    <p class="praise-banner">Cada emoção é bem-vinda. Aprender a lidar com elas é uma superpotência! 💪</p>
    <div class="nav">
      <button class="btn btn-ghost" id="diaryBtn">📖 Ver diário</button>
      <button class="btn btn-primary" id="restartBtn">Registrar de novo 🔄</button>
    </div>
  `;
  document.getElementById('restartBtn').onclick = ()=>{ resetEmoState(); renderEmocaoStep(); };
  document.getElementById('diaryBtn').onclick = renderEmoDiary;
  parseEmoji();
}

async function renderEmoDiary(){
  document.getElementById('subheader').textContent = 'Seu diário das emoções';
  setMascotMood(null);
  const cardArea = document.getElementById('cardArea');
  cardArea.innerHTML = `<h2 class="step-title">📖 Meu diário</h2><div id="diaryList"><p class="empty">Carregando...</p></div>
    <div class="nav"><button class="btn btn-primary" id="backToEmoBtn">Voltar</button></div>`;
  document.getElementById('backToEmoBtn').onclick = ()=>{ resetEmoState(); renderEmocaoStep(); };
  parseEmoji();
  const listEl = document.getElementById('diaryList');
  try{
    const keys = await store.list('emo-entry:');
    if(keys.length===0){
      listEl.innerHTML = '<p class="empty">Ainda não há registros. Registre como foi seu dia! 🌟</p>';
      return;
    }
    const entries = [];
    for(const k of keys){
      const raw = await store.get(k);
      if(raw){ try{ entries.push(JSON.parse(raw)); }catch(e){} }
    }
    entries.sort((a,b)=> b.date.localeCompare(a.date));
    listEl.innerHTML = entries.map(en => `
      <div class="diary-entry">
        <div class="date">${en.emotionEmoji} ${en.displayDate.charAt(0).toUpperCase()+en.displayDate.slice(1)}</div>
        <div class="row"><b>Senti:</b> ${en.emotionLabel}</div>
        <div class="row"><b>Fiz:</b> ${en.reaction}</div>
        <div class="row"><b>Próxima vez:</b> ${en.solution}</div>
      </div>
    `).join('');
  }catch(err){
    listEl.innerHTML = '<p class="empty">Não consegui carregar o diário agora.</p>';
  }finally{
    parseEmoji();
  }
}

function renderEmocaoStep(){
  if(emoStep===0) renderEmotionStep();
  else if(emoStep===1) renderReactionStep();
  else if(emoStep===2) renderSolutionStep();
  else renderEmoSummaryStep();
}

function renderEmocao(){
  resetEmoState();
  renderEmocaoStep();
}

/* ---------- TROFÉUS ---------- */
async function renderTrofeus(){
  document.getElementById('subheader').textContent = 'Suas conquistas até agora';
  setMascotMood('animado');
  const cardArea = document.getElementById('cardArea');
  cardArea.innerHTML = `
    <h2 class="step-title">Troféus 🏆</h2>
    <p class="step-sub">Cada estrela é uma conquista sua!</p>
    <div class="stat-card">
      <span class="ic">⭐</span>
      <div><div class="num">${starTotal}</div><div class="lbl">Estrelas conquistadas</div></div>
    </div>
    <div class="stat-card">
      <span class="ic">🧩</span>
      <div><div class="num">${puzzlesSolvedTotal}</div><div class="lbl">Quebra-cabeças resolvidos</div></div>
    </div>
  `;
  parseEmoji();
}

/* ---------- PERFIL ---------- */
const THEMES = [
  { id:'rosa', label:'Rosa', color:'#F2507E' },
  { id:'coral', label:'Laranja', color:'#FF8B67' },
  { id:'azul', label:'Azul', color:'#4C9BE8' },
  { id:'roxo', label:'Roxo', color:'#8B5CF6' },
  { id:'verde', label:'Verde', color:'#06D6A0' },
];
const AVATARS = [
  { id:'menino', emoji:'👦', label:'Menino' },
  { id:'menina', emoji:'👧', label:'Menina' },
  { id:'heroi', emoji:'🦸', label:'Herói' },
  { id:'dino', emoji:'🦖', label:'Dino' },
  { id:'unicornio', emoji:'🦄', label:'Unicórnio' },
  { id:'robo', emoji:'🤖', label:'Robô' },
];

let profileExtra = { idade:'', tema:'rosa', avatar:null };

async function loadProfileExtra(){
  const raw = await store.get('perfil:extra');
  if(raw){ try{ profileExtra = { ...profileExtra, ...JSON.parse(raw) }; }catch(e){} }
  applyTheme(profileExtra.tema);
}

function applyTheme(themeId){
  const t = THEMES.find(t=>t.id===themeId) || THEMES[0];
  document.documentElement.style.setProperty('--coral', t.color);
}

async function saveProfileExtra(){
  await store.set('perfil:extra', JSON.stringify(profileExtra));
  cloudSyncProfile();
}

async function switchStudent(){
  const ok = confirm('Trocar de jogador? O nome e o perfil salvos neste aparelho vão ser apagados para o próximo jogador começar do zero. (As estrelas conquistadas continuam salvas.)');
  if(!ok) return;
  profileName = null;
  await store.remove('perfil:nome');
  profileExtra = { idade:'', tema:'rosa', avatar:null };
  await store.remove('perfil:extra');
  applyTheme('coral');
  document.getElementById('editNameBtn').classList.remove('show');
  renderOnboarding();
}

function renderPerfil(){
  document.getElementById('subheader').textContent = 'Deixe do seu jeitinho';
  setMascotMood(null);
  const cardArea = document.getElementById('cardArea');
  cardArea.innerHTML = `
    <h2 class="step-title">Meu perfil ✨</h2>
    <p class="step-sub">Personalize como quiser</p>

    <label class="field-label">Apelido</label>
    <input type="text" id="pfNome" value="${profileName||''}" maxlength="30" placeholder="Seu apelido">

    <label class="field-label">Idade</label>
    <input type="number" id="pfIdade" value="${profileExtra.idade||''}" min="1" max="17" placeholder="Sua idade">

    <label class="field-label">Cor do tema</label>
    <div class="theme-row" id="themeRow"></div>

    <label class="field-label">Avatar</label>
    <div class="grid" id="avatarGrid"></div>

    <div class="nav">
      <button class="btn btn-primary" id="saveProfileBtn" style="width:100%">💾 Salvar perfil</button>
    </div>
    <p class="empty" id="savedMsg" style="display:none;">Perfil salvo! 🎉</p>

    <div class="stat-card">
      <span class="ic">⭐</span>
      <div><div class="num">${starTotal}</div><div class="lbl">Estrelas conquistadas</div></div>
    </div>

    <div class="top-link" id="trofeusLink">🏆 Ver meus troféus</div>

    <button class="btn btn-ghost" id="switchStudentBtn" style="width:100%; margin-top:14px;">🔄 Trocar de jogador</button>
  `;

  const themeRow = document.getElementById('themeRow');
  THEMES.forEach(t=>{
    const btn = document.createElement('button');
    btn.className = 'theme-swatch' + (profileExtra.tema===t.id ? ' selected':'');
    btn.style.background = t.color;
    btn.title = t.label;
    btn.setAttribute('aria-label', t.label);
    btn.onclick = ()=>{ profileExtra.tema = t.id; applyTheme(t.id); renderPerfil(); };
    themeRow.appendChild(btn);
  });

  const avatarGrid = document.getElementById('avatarGrid');
  AVATARS.forEach(a=>{
    const div = document.createElement('div');
    div.className = 'opt' + (profileExtra.avatar===a.id ? ' selected':'');
    div.innerHTML = `<span class="emoji">${a.emoji}</span><span>${a.label}</span>`;
    div.onclick = ()=>{ profileExtra.avatar = a.id; renderPerfil(); };
    avatarGrid.appendChild(div);
  });

  document.getElementById('saveProfileBtn').onclick = async ()=>{
    const nomeVal = document.getElementById('pfNome').value.trim();
    if(nomeVal){ profileName = nomeVal; await store.set('perfil:nome', nomeVal); updateGreeting(); }
    profileExtra.idade = document.getElementById('pfIdade').value;
    await saveProfileExtra();
    const msg = document.getElementById('savedMsg');
    msg.style.display = 'block';
    setTimeout(()=>{ msg.style.display='none'; }, 2000);
  };

  document.getElementById('switchStudentBtn').onclick = switchStudent;
  document.getElementById('trofeusLink').onclick = ()=> setTab('trofeus');
  parseEmoji();
}

/* ---------- NAV ---------- */
let currentTab = 'rotina';
function setTab(tab){
  currentTab = tab;
  if(tab==='rotina') renderRotina();
  else if(tab==='quebra') renderQuebra();
  else if(tab==='emocao') renderEmocao();
  else if(tab==='trofeus') renderTrofeus();
  else if(tab==='perfil') renderPerfil();
}

const VALID_TABS = ['rotina','quebra','emocao','trofeus','perfil'];
const requestedTabParam = new URLSearchParams(window.location.search).get('tab');
const requestedTab = VALID_TABS.includes(requestedTabParam) ? requestedTabParam : 'rotina';

/* ---------- INIT ---------- */
(async function init(){
  ensureCloudSession();
  await loadRotinaState();
  await loadPuzzleState();
  await loadStars();
  await loadProfile();
  await loadProfileExtra();
  const n = gridSize*gridSize;
  order = shuffle([...Array(n).keys()]);
  let sessionStarted = false;
  try{ sessionStarted = sessionStorage.getItem('joguinho_session_started') === '1'; }catch(e){}
  if(profileName){
    if(requestedTabParam){
      updateGreeting();
      setTab(requestedTab);
    } else if(sessionStarted){
      window.location.replace('menu.html');
    } else {
      renderOnboarding();
    }
  }else{
    renderOnboarding();
  }
})();
</script>
</body>

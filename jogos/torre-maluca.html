<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Torre Maluca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#EAF4FB; --card:#FFFFFF; --coral:#FF8B67; --yellow:#FFD166;
    --mint:#06D6A0; --plum:#3D348B; --plum-soft:#6C63AC; --ink:#2C2A4A;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0; height:100vh; height:100svh; overflow:hidden;
    background:
      radial-gradient(circle at 12% 15%, #DCEEFB 0%, transparent 40%),
      radial-gradient(circle at 88% 80%, #FDE9DC 0%, transparent 45%),
      var(--sky);
    font-family:'Quicksand', sans-serif; color:var(--ink);
    display:flex; flex-direction:column; align-items:center;
    padding:0; touch-action:none;
  }
  h1,h2,.display{ font-family:'Fredoka','Baloo 2', cursive; }
  .app{ width:100%; height:100%; display:flex; flex-direction:column; min-height:0; }

  .backbtn{
    width:32px; height:32px; border-radius:10px; background:white; border:3px solid #16214a;
    display:flex; align-items:center; justify-content:center; text-decoration:none;
    box-shadow:0 3px 0 #16214a; flex:0 0 auto; pointer-events:auto; transition:transform .1s ease, box-shadow .1s ease;
  }
  .backbtn:active{ transform:translateY(2px); box-shadow:none; }
  .fsbtn{ font-size:1rem; color:var(--plum); cursor:pointer; }
  .tc-arrow{ width:0; height:0; pointer-events:none; }
  .tc-arrow.left{ border-top:8px solid transparent; border-bottom:8px solid transparent; border-right:11px solid white; margin-left:-2px; }
  .tc-arrow.dark.left{ border-right-color:#16214a; }

  .hud-overlay{
    position:absolute; z-index:4;
    top:calc(14px + env(safe-area-inset-top, 0px));
    left:calc(14px + env(safe-area-inset-left, 0px));
    right:calc(14px + env(safe-area-inset-right, 0px));
    display:flex; align-items:flex-start; justify-content:space-between; gap:6px; pointer-events:none;
  }
  .hud-left{ display:flex; align-items:center; gap:6px; pointer-events:none; }
  .hud-stats{ display:flex; align-items:center; gap:6px; pointer-events:none; }
  .hud-badge{
    display:flex; align-items:center; gap:5px; background:white; border-radius:999px; padding:5px 12px;
    box-shadow:0 3px 8px rgba(61,52,139,0.16); font-family:'Fredoka','Baloo 2', cursive; font-size:0.85rem; color:var(--plum);
    white-space:nowrap;
  }

  .board-wrap{ flex:1 1 auto; min-height:0; width:100%; overflow:hidden; }
  .board-box{ position:relative; width:100%; height:100%; overflow:hidden; background:linear-gradient(180deg,#BFE4FF 0%,#EAF9F0 100%); }
  canvas{ width:100%; height:100%; display:block; }

  .tap-hint{
    position:absolute; z-index:3; bottom:calc(22px + env(safe-area-inset-bottom, 0px)); left:50%; transform:translateX(-50%);
    font-family:'Fredoka','Baloo 2', cursive; font-size:0.8rem; color:var(--plum); background:rgba(255,255,255,0.85);
    padding:6px 14px; border-radius:999px; pointer-events:none; box-shadow:0 4px 10px rgba(61,52,139,0.12);
    animation:tapPulse 1.4s ease-in-out infinite;
  }
  @keyframes tapPulse{ 0%,100%{ opacity:0.7; } 50%{ opacity:1; } }

  .overlay{
    position:absolute; inset:0; background:rgba(61,52,139,0.6); display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; color:white; padding:16px; z-index:10;
  }
  .overlay .big-emoji{ font-size:2.4rem; margin-bottom:2px; }
  .overlay h2{ margin:2px 0; font-size:1.15rem; }
  .overlay p{ margin:0 0 10px; font-weight:600; font-size:0.85rem; }
  button.btn{ font-family:'Fredoka','Baloo 2', cursive; font-size:0.95rem; border:none; border-radius:14px; padding:11px 20px; cursor:pointer; box-shadow:0 6px 14px rgba(61,52,139,0.25); transition:transform .12s ease; }
  button.btn:active{ transform:scale(0.96); }
  .btn-primary{ background:linear-gradient(180deg, #FFA588 0%, var(--coral) 100%); color:white; }
</style>
</head>
<body>
<div class="app">
  <div class="board-wrap" id="boardWrap">
    <div class="board-box" id="boardBox">
      <canvas id="board"></canvas>

      <div class="hud-overlay">
        <div class="hud-left">
          <a href="../menu.html" class="backbtn" aria-label="Voltar ao menu"><span class="tc-arrow left dark"></span></a>
          <button class="backbtn fsbtn" id="btnFullscreen" aria-label="Tela cheia" type="button">⛶</button>
        </div>
        <div class="hud-stats">
          <span class="hud-badge">🧱 <b id="scoreNum">0</b></span>
          <span class="hud-badge">🏆 <b id="bestNum">0</b></span>
        </div>
      </div>

      <div class="tap-hint" id="tapHint">👆 Toque pra empilhar!</div>

      <div class="overlay" id="startOverlay">
        <div class="big-emoji">🧱</div>
        <h2>Torre Maluca</h2>
        <p>Toque na hora certa pra empilhar os blocos bem no meio!<br>Vamos ver que torre alta você consegue fazer?</p>
        <button class="btn btn-primary" id="startBtn">Começar 🚀</button>
      </div>
      <div class="overlay" id="overOverlay" style="display:none;">
        <div class="big-emoji">🏗️</div>
        <h2>Ihh, a torre balançou!</h2>
        <p id="overStats"></p>
        <button class="btn btn-primary" id="restartBtn">Jogar de novo 🔄</button>
      </div>
    </div>
  </div>
</div>

<script>
let audioCtx = null;
function getAudioCtx(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } } if(audioCtx.state==='suspended'){ audioCtx.resume(); } return audioCtx; }
function playTone(freq, startTime, duration, type, peakGain){
  const ctx = getAudioCtx(); if(!ctx) return;
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type || 'triangle'; osc.frequency.value = freq;
  const t0 = ctx.currentTime + startTime;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peakGain || 0.14, t0 + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + duration + 0.02);
}
function playDrop(){ playTone(420, 0, 0.09, 'triangle', 0.12); }
function playPerfect(){ [660,880,1100].forEach((f,i)=> playTone(f, i*0.06, 0.14, 'triangle', 0.13)); }
function playStart(){ [392,587.33].forEach((f,i)=> playTone(f, i*0.09, 0.2, 'triangle', 0.13)); }
function playOver(){ [392,330,262].forEach((f,i)=> playTone(f, i*0.12, 0.22, 'sine', 0.11)); }

const canvas = document.getElementById('board');
const ctx2d = canvas.getContext('2d');
const boardBox = document.getElementById('boardBox');

let W = 400, H = 700;
function fitBoard(){
  const w = boardBox.clientWidth, h = boardBox.clientHeight;
  if(w <= 0 || h <= 0) return;
  W = w; H = h;
  canvas.width = W; canvas.height = H;
  computeLayout();
  draw();
}
window.addEventListener('resize', fitBoard);
window.addEventListener('orientationchange', fitBoard);

const fsBtn = document.getElementById('btnFullscreen');
const fsTarget = document.documentElement;
function isFullscreen(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function isIOS(){ return /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function isStandalone(){ return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; }
function toggleFullscreen(){
  const req = fsTarget.requestFullscreen || fsTarget.webkitRequestFullscreen;
  if(req){
    if(!isFullscreen()){ req.call(fsTarget); }
    else { const exit = document.exitFullscreen || document.webkitExitFullscreen; if(exit) exit.call(document); }
    return;
  }
  if(isIOS() && !isStandalone()){
    alert('No iPhone: toque no botao de compartilhar do Safari e escolha "Adicionar a Tela de Inicio". Assim o jogo abre em tela cheia.');
  }
}
fsBtn.addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', () => setTimeout(fitBoard, 60));
document.addEventListener('webkitfullscreenchange', () => setTimeout(fitBoard, 60));

const PALETTE = ['#FF8B67','#FFD166','#06D6A0','#4EA8DE','#B79CED','#FF6B9D','#7ED957','#FFA5C3'];

let blockH, baseY, visibleRows;
function computeLayout(){
  blockH = Math.max(30, Math.min(48, H * 0.075));
  baseY = H - Math.max(50, H*0.08);
  visibleRows = Math.floor((H - 90) / blockH);
}

let stack = [];
let moving = null;
let fallingPieces = [];
let running = false;
let score = 0, best = 0;
let combo = 0;
let toast = null;

function loadBest(){ try{ return parseInt(localStorage.getItem('torre_maluca_best')||'0'); }catch(e){ return 0; } }
function saveBest(v){ try{ localStorage.setItem('torre_maluca_best', String(v)); }catch(e){} }
best = loadBest();
document.getElementById('bestNum').textContent = best;

function resetState(){
  const baseW = Math.min(W*0.55, 220);
  stack = [{ x: W/2 - baseW/2, w: baseW, color: '#8B93A8' }];
  score = 0;
  combo = 0;
  fallingPieces = [];
  document.getElementById('scoreNum').textContent = score;
  spawnMoving();
}

function spawnMoving(){
  const last = stack[stack.length-1];
  const speed = Math.min(3.6, 1.7 + stack.length*0.05);
  const fromLeft = Math.random() < 0.5;
  moving = {
    x: fromLeft ? -last.w : W,
    w: last.w,
    dir: fromLeft ? 1 : -1,
    speed,
    color: PALETTE[stack.length % PALETTE.length]
  };
}

function dropBlock(){
  if(!running || !moving) return;
  const last = stack[stack.length-1];
  const left = Math.max(moving.x, last.x);
  const right = Math.min(moving.x + moving.w, last.x + last.w);
  const overlap = right - left;

  if(overlap <= 2){
    gameOver();
    return;
  }

  let newX = left, newW = overlap;
  const nearPerfect = overlap >= last.w * 0.92;
  if(nearPerfect){
    newX = last.x; newW = last.w;
    combo++;
    playPerfect();
    showToast(combo > 1 ? `PERFEITO! x${combo}` : 'PERFEITO!');
  } else {
    combo = 0;
    playDrop();
  }

  if(moving.x < newX){
    const w = newX - moving.x;
    if(w > 1) spawnFalling(moving.x, w, moving.color, moving.dir<0?-1:-1);
  }
  const rightover = (moving.x + moving.w) - (newX + newW);
  if(rightover > 1){
    spawnFalling(newX+newW, rightover, moving.color, 1);
  }

  stack.push({ x:newX, w:newW, color: moving.color });
  score++;
  document.getElementById('scoreNum').textContent = score;
  spawnMoving();
}

function spawnFalling(x, w, color, dirBias){
  fallingPieces.push({
    x, w, h: blockH, color,
    y: baseY - (stack.length-1)*blockH,
    vx: (0.6 + Math.random()*1.2) * (dirBias || (Math.random()<0.5?-1:1)),
    vy: -2 - Math.random()*2,
    rot: 0, vrot: (Math.random()-0.5)*0.2
  });
}

function updateFalling(dt){
  for(let i=fallingPieces.length-1;i>=0;i--){
    const p = fallingPieces[i];
    p.vy += 0.35;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += p.vrot * dt;
    if(p.y - scrollY() > H + 80) fallingPieces.splice(i,1);
  }
}

function scrollY(){
  const topIndex = stack.length - 1;
  return topIndex > visibleRows ? (topIndex - visibleRows) * blockH : 0;
}

function showToast(text){
  toast = { text, t: 0 };
}

function update(dt){
  if(!running) return;
  if(moving){
    moving.x += moving.dir * moving.speed * dt;
    const overshoot = 6;
    if(moving.dir > 0 && moving.x > W + overshoot) moving.dir = -1;
    if(moving.dir < 0 && moving.x + moving.w < -overshoot) moving.dir = 1;
  }
  updateFalling(dt);
  if(toast){ toast.t += dt; if(toast.t > 55) toast = null; }
}

function roundRect(c,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

function drawBlock(x, y, w, h, color){
  ctx2d.fillStyle = color;
  roundRect(ctx2d, x, y, w, h, 8);
  ctx2d.fill();
  ctx2d.fillStyle = 'rgba(255,255,255,0.35)';
  roundRect(ctx2d, x+3, y+3, Math.max(0,w-6), Math.max(0,h*0.32), 5);
  ctx2d.fill();
  ctx2d.strokeStyle = 'rgba(0,0,0,0.12)';
  ctx2d.lineWidth = 1.5;
  roundRect(ctx2d, x, y, w, h, 8);
  ctx2d.stroke();
}

function draw(){
  ctx2d.clearRect(0,0,W,H);
  ctx2d.fillStyle = '#EAF9F0';
  ctx2d.fillRect(0,0,W,H);
  ctx2d.fillStyle = 'rgba(255,255,255,0.5)';
  ctx2d.beginPath(); ctx2d.arc(W*0.22, H*0.14, 26, 0, Math.PI*2); ctx2d.fill();
  ctx2d.beginPath(); ctx2d.arc(W*0.24, H*0.14, 20, 0, Math.PI*2); ctx2d.fill();
  ctx2d.beginPath(); ctx2d.arc(W*0.78, H*0.09, 20, 0, Math.PI*2); ctx2d.fill();

  const sY = scrollY();

  stack.forEach((b, i) => {
    const y = baseY - i*blockH + sY;
    if(y > H + blockH || y < -blockH) return;
    drawBlock(b.x, y, b.w, blockH, b.color);
  });

  fallingPieces.forEach(p => {
    ctx2d.save();
    ctx2d.translate(p.x + p.w/2, p.y - sY + blockH/2);
    ctx2d.rotate(p.rot);
    drawBlock(-p.w/2, -blockH/2, p.w, blockH, p.color);
    ctx2d.restore();
  });

  if(moving && running){
    const y = baseY - stack.length*blockH + sY;
    drawBlock(moving.x, y, moving.w, blockH, moving.color);
  }

  if(toast){
    const alpha = Math.max(0, 1 - toast.t/55);
    ctx2d.save();
    ctx2d.globalAlpha = alpha;
    ctx2d.fillStyle = '#3D348B';
    ctx2d.font = '800 22px "Fredoka", "Baloo 2", cursive';
    ctx2d.textAlign = 'center';
    ctx2d.textBaseline = 'middle';
    const ty = baseY - stack.length*blockH + sY - toast.t*0.5;
    ctx2d.fillText(toast.text, W/2, ty);
    ctx2d.restore();
  }
}

let lastT = 0;
function loop(t){
  const dt = lastT ? Math.min(2.2, (t-lastT)/16.67) : 1;
  lastT = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

canvas.addEventListener('pointerdown', () => {
  if(!running) return;
  document.getElementById('tapHint').style.display = 'none';
  dropBlock();
});
window.addEventListener('keydown', (e) => {
  if(e.code === 'Space'){ e.preventDefault(); if(running) dropBlock(); }
});

function startGame(){
  resetState();
  running = true;
  playStart();
  document.getElementById('tapHint').style.display = 'block';
  document.getElementById('startOverlay').style.display = 'none';
  document.getElementById('overOverlay').style.display = 'none';
  draw();
}

function gameOver(){
  running = false;
  playOver();
  if(score > best){ best = score; saveBest(best); document.getElementById('bestNum').textContent = best; }
  document.getElementById('overStats').textContent = `Sua torre ficou com ${score} bloco${score===1?'':'s'} de altura!`;
  document.getElementById('overOverlay').style.display = 'flex';
}

document.getElementById('startBtn').onclick = startGame;
document.getElementById('restartBtn').onclick = startGame;

fitBoard();
resetState();
draw();
requestAnimationFrame(loop);
</script>
</body>
</html>

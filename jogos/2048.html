<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Jogo 2048</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#EAF4FB; --card:#FFFFFF; --coral:#FF8B67; --yellow:#FFD166;
    --mint:#06D6A0; --plum:#3D348B; --plum-soft:#6C63AC; --ink:#2C2A4A;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0; height:100vh; height:100svh; overflow:hidden;
    background:
      radial-gradient(circle at 12% 15%, #DCEEFB 0%, transparent 40%),
      radial-gradient(circle at 88% 80%, #FDE9DC 0%, transparent 45%),
      var(--sky);
    font-family:'Quicksand', sans-serif; color:var(--ink);
    display:flex; flex-direction:column; align-items:center;
    padding:10px 12px; touch-action:none;
  }
  h1,h2,.display{ font-family:'Baloo 2', cursive; }
  .app{ width:100%; max-width:400px; height:100%; display:flex; flex-direction:column; min-height:0; }
  .topnav{ display:flex; align-items:center; margin-bottom:6px; flex:0 0 auto; }
  .backbtn{ width:38px; height:38px; border-radius:50%; background:white; display:flex; align-items:center; justify-content:center; font-size:1.15rem; color:var(--plum); text-decoration:none; box-shadow:0 4px 10px rgba(61,52,139,0.12); }
  header.top{ text-align:center; margin-bottom:8px; flex:0 0 auto; }
  header.top h1{ font-size:1.2rem; color:var(--plum); margin:0 0 2px; }
  header.top p{ margin:0; color:var(--plum-soft); font-weight:600; font-size:0.8rem; }
  .stats{ display:flex; justify-content:space-around; align-items:center; margin-bottom:8px; flex:0 0 auto; }
  .stat{ text-align:center; }
  .stat .num{ font-family:'Baloo 2', cursive; font-size:1.1rem; color:var(--coral); }
  .stat .lbl{ font-size:0.65rem; color:var(--plum-soft); font-weight:600; }
  .restart-pill{
    background:white; border:none; border-radius:999px; padding:8px 14px; font-family:'Baloo 2', cursive;
    color:var(--plum-soft); font-size:0.8rem; box-shadow:0 4px 10px rgba(61,52,139,0.10); cursor:pointer;
  }
  .grid-wrap{ flex:1 1 auto; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .grid{
    position:relative;
    background:#DCD6EE; border-radius:16px; padding:8px;
    display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(4,1fr); gap:8px;
  }
  .cell{
    background:rgba(255,255,255,0.5); border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2', cursive; font-weight:700; color:var(--ink);
    font-size:1em; transition:background .15s ease, transform .1s ease;
  }
  .cell.big{ font-size:0.78em; }
  .cell.huge{ font-size:0.62em; }
  .overlay{
    position:fixed; inset:0; background:rgba(61,52,139,0.55); display:none; align-items:center; justify-content:center; padding:20px; z-index:10;
  }
  .overlay.show{ display:flex; }
  .win-card{ background:white; border-radius:24px; padding:26px 22px; text-align:center; max-width:320px; box-shadow:0 20px 40px rgba(0,0,0,0.2); }
  .win-card .big-emoji{ font-size:2.6rem; }
  button.btn{ font-family:'Baloo 2', cursive; font-size:0.95rem; border:none; border-radius:16px; padding:11px 20px; cursor:pointer; transition:transform .15s ease; margin-top:10px; }
  button.btn:active{ transform:scale(0.96); }
  .btn-primary{ background:var(--coral); color:white; width:100%; }
  .btn-ghost{ background:#F0EEFC; color:var(--plum-soft); width:100%; }
</style>
</head>
<body>
<div class="app">
  <div class="topnav"><a href="../menu.html" class="backbtn" aria-label="Voltar ao menu">⬅</a></div>
  <header class="top">
    <h1>🔢 Jogo 2048</h1>
    <p>Deslize pra juntar os números iguais!</p>
  </header>

  <div class="stats">
    <div class="stat"><div class="num" id="scoreNum">0</div><div class="lbl">Pontos</div></div>
    <button class="restart-pill" id="restartBtn2">🔄 Reiniciar</button>
    <div class="stat"><div class="num" id="bestNum">0</div><div class="lbl">Recorde</div></div>
  </div>

  <div class="grid-wrap" id="gridWrap">
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="overlay" id="winOverlay">
  <div class="win-card">
    <div class="big-emoji">🎉</div>
    <h2>Você chegou ao 2048!</h2>
    <p style="color:var(--plum-soft); font-weight:600;">Quer continuar jogando pra ir mais longe?</p>
    <button class="btn btn-primary" id="continueBtn">Continuar jogando</button>
    <button class="btn btn-ghost" id="newFromWinBtn">Começar de novo 🔄</button>
  </div>
</div>

<div class="overlay" id="overOverlay">
  <div class="win-card">
    <div class="big-emoji">😊</div>
    <h2>Não deu mais pra juntar!</h2>
    <p id="overStats" style="color:var(--plum-soft); font-weight:600;"></p>
    <button class="btn btn-primary" id="restartBtn">Jogar de novo 🔄</button>
  </div>
</div>

<script>
let audioCtx = null;
function getAudioCtx(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } } if(audioCtx.state==='suspended'){ audioCtx.resume(); } return audioCtx; }
function playTone(freq, startTime, duration, type, peakGain){
  const ctx = getAudioCtx(); if(!ctx) return;
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type || 'triangle'; osc.frequency.value = freq;
  const t0 = ctx.currentTime + startTime;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peakGain || 0.14, t0 + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + duration + 0.02);
}
function playMerge(){ playTone(660, 0, 0.1, 'triangle', 0.11); }
function playWin(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=> playTone(f, i*0.09, 0.22, 'triangle', 0.13)); }
function playOver(){ playTone(240, 0, 0.2, 'sine', 0.08); }

const TILE_COLORS = {
  2:'#FDEEDC', 4:'#FCE0C2', 8:'#FFD199', 16:'#FFB870', 32:'#FF9F52',
  64:'#FF8B67', 128:'#FFD166', 256:'#FFCB4D', 512:'#8FE3C4', 1024:'#4C9BE8', 2048:'#8B5CF6'
};

const gridWrap = document.getElementById('gridWrap');
const gridEl2 = document.getElementById('grid');
function fitBoard(){
  const size = Math.max(180, Math.floor(Math.min(gridWrap.clientWidth, gridWrap.clientHeight)));
  gridEl2.style.width = size + 'px';
  gridEl2.style.height = size + 'px';
  gridEl2.style.fontSize = Math.floor(size/4*0.42) + 'px';
}
window.addEventListener('resize', fitBoard);
window.addEventListener('orientationchange', fitBoard);

let grid, score, best, over, won;

function loadBest(){ try{ return parseInt(localStorage.getItem('2048_best')||'0'); }catch(e){ return 0; } }
function saveBest(v){ try{ localStorage.setItem('2048_best', String(v)); }catch(e){} }
best = loadBest();
document.getElementById('bestNum').textContent = best;

function idx(r,c){ return r*4+c; }

function addRandomTile(){
  const empties = [];
  for(let i=0;i<16;i++) if(grid[i]===0) empties.push(i);
  if(!empties.length) return;
  const i = empties[Math.floor(Math.random()*empties.length)];
  grid[i] = Math.random() < 0.9 ? 2 : 4;
}

function resetState(){
  grid = Array(16).fill(0);
  score = 0; over = false; won = false;
  addRandomTile(); addRandomTile();
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('winOverlay').classList.remove('show');
  document.getElementById('overOverlay').classList.remove('show');
  render();
}

function getRow(r){ return [0,1,2,3].map(c=>grid[idx(r,c)]); }
function setRow(r,vals){ vals.forEach((v,c)=>grid[idx(r,c)]=v); }
function getCol(c){ return [0,1,2,3].map(r=>grid[idx(r,c)]); }
function setCol(c,vals){ vals.forEach((v,r)=>grid[idx(r,c)]=v); }

function slideMerge(line){
  const orig = [...line];
  let arr = line.filter(v=>v!==0);
  let gained = 0;
  for(let i=0;i<arr.length-1;i++){
    if(arr[i]===arr[i+1]){
      arr[i] *= 2;
      gained += arr[i];
      arr.splice(i+1,1);
    }
  }
  while(arr.length < 4) arr.push(0);
  const moved = orig.some((v,i)=> v !== arr[i]);
  return { line:arr, gained, moved };
}

function move(dir){
  if(over) return;
  let anyMoved = false, totalGained = 0;
  if(dir==='left' || dir==='right'){
    for(let r=0;r<4;r++){
      let row = getRow(r);
      if(dir==='right') row = row.reverse();
      const res = slideMerge(row);
      let newRow = res.line;
      if(dir==='right') newRow = newRow.reverse();
      setRow(r, newRow);
      if(res.moved) anyMoved = true;
      totalGained += res.gained;
    }
  } else {
    for(let c=0;c<4;c++){
      let col = getCol(c);
      if(dir==='down') col = col.reverse();
      const res = slideMerge(col);
      let newCol = res.line;
      if(dir==='down') newCol = newCol.reverse();
      setCol(c, newCol);
      if(res.moved) anyMoved = true;
      totalGained += res.gained;
    }
  }
  if(anyMoved){
    score += totalGained;
    if(totalGained > 0) playMerge();
    document.getElementById('scoreNum').textContent = score;
    if(score > best){ best = score; saveBest(best); document.getElementById('bestNum').textContent = best; }
    addRandomTile();
    render();
    checkWin();
    checkGameOver();
  }
}

function hasMoves(){
  if(grid.includes(0)) return true;
  for(let r=0;r<4;r++){
    for(let c=0;c<4;c++){
      const v = grid[idx(r,c)];
      if(c<3 && v === grid[idx(r,c+1)]) return true;
      if(r<3 && v === grid[idx(r+1,c)]) return true;
    }
  }
  return false;
}

function checkWin(){
  if(!won && grid.includes(2048)){
    won = true;
    playWin();
    document.getElementById('winOverlay').classList.add('show');
  }
}

function checkGameOver(){
  if(!hasMoves()){
    over = true;
    playOver();
    document.getElementById('overStats').textContent = `Você fez ${score} pontos!`;
    document.getElementById('overOverlay').classList.add('show');
  }
}

function render(){
  const el = document.getElementById('grid');
  el.innerHTML = '';
  grid.forEach(v=>{
    const cell = document.createElement('div');
    let cls = 'cell';
    if(v >= 1000) cls += ' huge';
    else if(v >= 100) cls += ' big';
    cell.className = cls;
    if(v){
      cell.textContent = v;
      cell.style.background = TILE_COLORS[v] || '#5B3FA6';
      cell.style.color = v >= 64 ? '#FFFFFF' : 'var(--ink)';
    }
    el.appendChild(cell);
  });
}

window.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowLeft') move('left');
  else if(e.key==='ArrowRight') move('right');
  else if(e.key==='ArrowUp') move('up');
  else if(e.key==='ArrowDown') move('down');
});

let touchX=0, touchY=0;
const gridEl = document.getElementById('grid');
gridEl.addEventListener('touchstart', (e)=>{
  touchX = e.touches[0].clientX; touchY = e.touches[0].clientY;
}, {passive:true});
gridEl.addEventListener('touchend', (e)=>{
  const dx = e.changedTouches[0].clientX - touchX;
  const dy = e.changedTouches[0].clientY - touchY;
  if(Math.max(Math.abs(dx),Math.abs(dy)) < 24) return;
  if(Math.abs(dx) > Math.abs(dy)) move(dx>0 ? 'right' : 'left');
  else move(dy>0 ? 'down' : 'up');
}, {passive:true});

document.getElementById('restartBtn').onclick = resetState;
document.getElementById('restartBtn2').onclick = resetState;
document.getElementById('newFromWinBtn').onclick = resetState;
document.getElementById('continueBtn').onclick = ()=> document.getElementById('winOverlay').classList.remove('show');

fitBoard();
resetState();
</script>
</body>
</html>

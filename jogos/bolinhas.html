<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Junte as Bolinhas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#EAF4FB; --card:#FFFFFF; --coral:#FF8B67; --yellow:#FFD166;
    --mint:#06D6A0; --plum:#3D348B; --plum-soft:#6C63AC; --ink:#2C2A4A;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0; height:100vh; height:100svh; overflow:hidden;
    background:
      radial-gradient(circle at 12% 15%, #DCEEFB 0%, transparent 40%),
      radial-gradient(circle at 88% 80%, #FDE9DC 0%, transparent 45%),
      var(--sky);
    font-family:'Quicksand', sans-serif; color:var(--ink);
    display:flex; flex-direction:column; align-items:center;
    padding:10px 12px;
  }
  h1,h2,.display{ font-family:'Baloo 2', cursive; }
  .app{ width:100%; max-width:460px; height:100%; display:flex; flex-direction:column; min-height:0; }
  .topnav{ display:flex; align-items:center; margin-bottom:6px; flex:0 0 auto; }
  .backbtn{ width:38px; height:38px; border-radius:50%; background:white; display:flex; align-items:center; justify-content:center; font-size:1.15rem; color:var(--plum); text-decoration:none; box-shadow:0 4px 10px rgba(61,52,139,0.12); }
  header.top{ text-align:center; margin-bottom:8px; flex:0 0 auto; }
  header.top h1{ font-size:1.15rem; color:var(--plum); margin:0 0 2px; }
  header.top p{ margin:0; color:var(--plum-soft); font-weight:600; font-size:0.78rem; }
  .setup{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; justify-content:center; }
  .card-box{ background:var(--card); border-radius:26px; padding:22px 20px; box-shadow:0 14px 30px rgba(61,52,139,0.10); }
  .step-title{ text-align:center; font-size:1.1rem; color:var(--plum); margin:0 0 14px; }
  .diff-grid{ display:grid; gap:12px; }
  .diff-opt{
    border:3px solid transparent; background:#F5F3FF; border-radius:18px; padding:14px;
    text-align:center; cursor:pointer; font-family:'Baloo 2', cursive; font-size:1rem;
    color:var(--ink); -webkit-tap-highlight-color:transparent;
  }
  .diff-opt small{ display:block; font-family:'Quicksand',sans-serif; font-weight:600; color:var(--plum-soft); font-size:0.78rem; margin-top:2px;}
  .diff-opt:active{ transform:scale(0.97); }
  .stats{ display:flex; justify-content:space-around; margin-bottom:8px; flex:0 0 auto; }
  .stat{ text-align:center; }
  .stat .num{ font-family:'Baloo 2', cursive; font-size:1.1rem; color:var(--coral); }
  .stat .lbl{ font-size:0.68rem; color:var(--plum-soft); font-weight:600; }
  .tubes-wrap{
    flex:1 1 auto; min-height:0; width:100%; overflow:hidden;
    display:flex; flex-wrap:wrap; align-content:center; justify-content:center; gap:12px; padding:4px;
  }
  .tube{
    width:15vw; max-width:56px; min-width:38px;
    display:flex; flex-direction:column-reverse; gap:3px;
    background:rgba(255,255,255,0.55); border:3px solid rgba(255,255,255,0.9);
    border-radius:0 0 16px 16px; padding:4px;
    box-shadow:inset 0 4px 10px rgba(61,52,139,0.12), 0 6px 12px rgba(61,52,139,0.08);
    cursor:pointer; -webkit-tap-highlight-color:transparent; transition:transform .12s ease;
  }
  .tube.selected{ transform:translateY(-10px); border-color:var(--coral); }
  .slot{ width:100%; aspect-ratio:1; border-radius:50%; background:rgba(61,52,139,0.06); }
  .slot.filled{ background:var(--c); box-shadow:inset 0 -4px 6px rgba(0,0,0,0.15), inset 0 3px 4px rgba(255,255,255,0.4); }
  .overlay{
    position:fixed; inset:0; background:rgba(61,52,139,0.55); display:none; align-items:center; justify-content:center; padding:20px; z-index:10;
  }
  .overlay.show{ display:flex; }
  .win-card{ background:white; border-radius:24px; padding:26px 22px; text-align:center; max-width:320px; box-shadow:0 20px 40px rgba(0,0,0,0.2); }
  .win-card .big-emoji{ font-size:2.6rem; }
  button.btn{ font-family:'Baloo 2', cursive; font-size:0.95rem; border:none; border-radius:16px; padding:11px 20px; cursor:pointer; transition:transform .15s ease; margin-top:12px; }
  button.btn:active{ transform:scale(0.96); }
  .btn-primary{ background:var(--coral); color:white; width:100%; }
</style>
</head>
<body>
<div class="app">
  <div class="topnav"><a href="../menu.html" class="backbtn" aria-label="Voltar ao menu">⬅</a></div>
  <header class="top">
    <h1>🧪 Junte as Bolinhas</h1>
    <p>Toque num tubo, depois no tubo pra onde quer jogar!</p>
  </header>

  <div class="setup" id="setup">
    <div class="card-box">
      <h2 class="step-title">Escolha a dificuldade</h2>
      <div class="diff-grid">
        <div class="diff-opt" data-lvl="facil">🟢 Fácil <small>4 cores</small></div>
        <div class="diff-opt" data-lvl="medio">🟡 Médio <small>5 cores</small></div>
        <div class="diff-opt" data-lvl="dificil">🔴 Difícil <small>6 cores</small></div>
      </div>
    </div>
  </div>

  <div id="gameArea" style="display:none; flex:1; min-height:0; display:flex; flex-direction:column;">
    <div class="stats">
      <div class="stat"><div class="num" id="movesNum">0</div><div class="lbl">Movimentos</div></div>
      <div class="stat"><div class="num" id="levelLbl">Fácil</div><div class="lbl">Nível</div></div>
    </div>
    <div class="tubes-wrap" id="tubesWrap"></div>
  </div>
</div>

<div class="overlay" id="winOverlay">
  <div class="win-card">
    <div class="big-emoji">🎉</div>
    <h2>Tudo organizado!</h2>
    <p id="winStats" style="color:var(--plum-soft); font-weight:600;"></p>
    <button class="btn btn-primary" id="playAgainBtn">Jogar de novo 🔄</button>
  </div>
</div>

<script>
let audioCtx = null;
function getAudioCtx(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } } if(audioCtx.state==='suspended'){ audioCtx.resume(); } return audioCtx; }
function playTone(freq, startTime, duration, type, peakGain){
  const ctx = getAudioCtx(); if(!ctx) return;
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type || 'triangle'; osc.frequency.value = freq;
  const t0 = ctx.currentTime + startTime;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peakGain || 0.14, t0 + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + duration + 0.02);
}
function playPour(){ playTone(560, 0, 0.1, 'triangle', 0.11); }
function playInvalid(){ playTone(220, 0, 0.15, 'sine', 0.08); }
function playWin(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=> playTone(f, i*0.09, 0.22, 'triangle', 0.13)); }

const COLORS = ['#FF8B67','#06D6A0','#FFD166','#8B5CF6','#4C9BE8','#FF6B9D'];
const CAPACITY = 4;
const LEVELS = {
  facil:   { colors:4, empty:2, label:'Fácil' },
  medio:   { colors:5, empty:2, label:'Médio' },
  dificil: { colors:6, empty:3, label:'Difícil' }
};

let tubes = [];
let selected = null;
let moves = 0;
let level = null;

function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function generatePuzzle(cfg){
  const colors = COLORS.slice(0, cfg.colors);
  let pool = [];
  colors.forEach(c => { for(let i=0;i<CAPACITY;i++) pool.push(c); });
  pool = shuffle(pool);
  const t = [];
  for(let i=0;i<cfg.colors;i++) t.push(pool.splice(0, CAPACITY));
  for(let i=0;i<cfg.empty;i++) t.push([]);
  return shuffle(t);
}

function isValidMove(from, to){
  if(from===to) return false;
  if(tubes[from].length===0) return false;
  if(tubes[to].length>=CAPACITY) return false;
  if(tubes[to].length===0) return true;
  return tubes[to][tubes[to].length-1] === tubes[from][tubes[from].length-1];
}

function doMove(from, to){
  const color = tubes[from][tubes[from].length-1];
  let runLen = 0;
  for(let k=tubes[from].length-1; k>=0 && tubes[from][k]===color; k--) runLen++;
  const space = CAPACITY - tubes[to].length;
  const moveCount = Math.min(runLen, space);
  const moved = tubes[from].splice(tubes[from].length-moveCount, moveCount);
  tubes[to].push(...moved);
}

function isWin(){
  return tubes.every(t => t.length===0 || (t.length===CAPACITY && t.every(c=>c===t[0])));
}

function renderTubes(){
  const wrap = document.getElementById('tubesWrap');
  wrap.innerHTML = '';
  tubes.forEach((t,i)=>{
    const el = document.createElement('div');
    el.className = 'tube' + (selected===i ? ' selected' : '');
    for(let s=0; s<CAPACITY; s++){
      const slot = document.createElement('div');
      if(s < t.length){
        slot.className = 'slot filled';
        slot.style.setProperty('--c', t[s]);
      } else {
        slot.className = 'slot';
      }
      el.appendChild(slot);
    }
    el.onclick = ()=> tapTube(i);
    wrap.appendChild(el);
  });
}

function tapTube(i){
  if(selected===null){
    if(tubes[i].length===0) return;
    selected = i;
    renderTubes();
    return;
  }
  if(selected === i){
    selected = null;
    renderTubes();
    return;
  }
  if(isValidMove(selected, i)){
    doMove(selected, i);
    moves++;
    document.getElementById('movesNum').textContent = moves;
    playPour();
    selected = null;
    renderTubes();
    if(isWin()) setTimeout(showWin, 350);
  } else {
    playInvalid();
    selected = null;
    renderTubes();
  }
}

function showWin(){
  playWin();
  document.getElementById('winStats').textContent = `Você resolveu em ${moves} movimentos!`;
  document.getElementById('winOverlay').classList.add('show');
}

function startLevel(lvlKey){
  level = LEVELS[lvlKey];
  tubes = generatePuzzle(level);
  selected = null;
  moves = 0;
  document.getElementById('movesNum').textContent = moves;
  document.getElementById('levelLbl').textContent = level.label;
  document.getElementById('setup').style.display = 'none';
  document.getElementById('gameArea').style.display = 'flex';
  document.getElementById('winOverlay').classList.remove('show');
  renderTubes();
}

document.querySelectorAll('.diff-opt').forEach(el=>{
  el.onclick = ()=> startLevel(el.dataset.lvl);
});
document.getElementById('playAgainBtn').onclick = ()=>{
  document.getElementById('winOverlay').classList.remove('show');
  document.getElementById('gameArea').style.display = 'none';
  document.getElementById('setup').style.display = 'flex';
};
</script>
</body>
</html>

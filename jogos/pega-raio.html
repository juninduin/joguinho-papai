<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pega-Raio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#EAF4FB; --card:#FFFFFF; --coral:#FF8B67; --yellow:#FFD166;
    --mint:#06D6A0; --plum:#3D348B; --plum-soft:#6C63AC; --ink:#2C2A4A;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0; height:100vh; height:100svh; overflow:hidden;
    background:
      radial-gradient(circle at 12% 15%, #FFF4D6 0%, transparent 45%),
      radial-gradient(circle at 88% 80%, #FDE9DC 0%, transparent 45%),
      var(--sky);
    font-family:'Quicksand', sans-serif; color:var(--ink);
    display:flex; flex-direction:column; align-items:center;
    padding:0; touch-action:none;
  }
  h1,h2,.display{ font-family:'Baloo 2', cursive; }
  .app{ width:100%; height:100%; display:flex; flex-direction:column; min-height:0; }

  .backbtn{
    width:32px; height:32px; border-radius:10px; background:white; border:3px solid #16214a;
    display:flex; align-items:center; justify-content:center; text-decoration:none;
    box-shadow:0 3px 0 #16214a; flex:0 0 auto; pointer-events:auto; transition:transform .1s ease, box-shadow .1s ease;
  }
  .backbtn:active{ transform:translateY(2px); box-shadow:none; }
  .fsbtn{ font-size:1rem; color:var(--plum); cursor:pointer; }
  .tc-arrow{ width:0; height:0; pointer-events:none; }
  .tc-arrow.left{ border-top:8px solid transparent; border-bottom:8px solid transparent; border-right:11px solid white; margin-left:-2px; }
  .tc-arrow.dark.left{ border-right-color:#16214a; }

  .hud-overlay{
    position:absolute; z-index:4;
    top:calc(14px + env(safe-area-inset-top, 0px));
    left:calc(14px + env(safe-area-inset-left, 0px));
    right:calc(14px + env(safe-area-inset-right, 0px));
    display:flex; align-items:flex-start; justify-content:space-between; gap:6px; pointer-events:none;
  }
  .hud-left{ display:flex; align-items:center; gap:6px; pointer-events:none; }
  .hud-stats{ display:flex; align-items:center; gap:6px; pointer-events:none; }
  .hud-badge{
    display:flex; align-items:center; gap:5px; background:white; border-radius:999px; padding:5px 12px;
    box-shadow:0 3px 8px rgba(61,52,139,0.16); font-family:'Baloo 2', cursive; font-size:0.85rem; color:var(--plum);
    white-space:nowrap;
  }

  .board-wrap{ flex:1 1 auto; min-height:0; width:100%; overflow:hidden; }
  .board-box{ position:relative; width:100%; height:100%; overflow:hidden; }
  .field-wrap{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .field{
    position:relative;
    display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:10px;
  }
  .catch-fx{
    position:absolute; left:0; top:0; pointer-events:none; z-index:5;
    font-family:'Baloo 2', cursive; font-weight:800; font-size:2rem; color:var(--mint);
    text-shadow:0 3px 6px rgba(0,0,0,0.22); white-space:nowrap;
    transform:translate(-50%,-50%); animation:catchFloat .8s ease-out forwards;
  }
  .catch-fx.bonus{ color:#E0A800; }
  .catch-fx.bomb{ color:#FF4747; font-size:2.3rem; }
  @keyframes catchFloat{
    0%{ transform:translate(-50%,-50%) scale(0.5); opacity:0; }
    30%{ transform:translate(-50%,-85%) scale(1.35); opacity:1; }
    100%{ transform:translate(-50%,-190%) scale(1); opacity:0; }
  }
  .hole{
    position:relative; border:none; border-radius:50%; cursor:pointer; -webkit-tap-highlight-color:transparent;
    background:radial-gradient(circle at 50% 40%, #C9B08A 0%, #A6875E 70%, #8A6B47 100%);
    box-shadow:inset 0 6px 10px rgba(0,0,0,0.25);
    overflow:hidden;
  }
  .pop{
    position:absolute; left:50%; bottom:0; transform:translate(-50%, 70%); width:70%; height:70%;
    transition:transform .16s cubic-bezier(.34,1.56,.64,1);
    display:flex; align-items:center; justify-content:center;
  }
  .hole.up .pop{ transform:translate(-50%, 8%); }
  .critter{ width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 4px 4px rgba(0,0,0,0.25)); }
  .critter.is-photo{ object-fit:cover; border-radius:50%; }
  .bolt{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:min(12vw, 4.6rem); line-height:1; filter:drop-shadow(0 4px 4px rgba(0,0,0,0.25)); }
  .overlay{
    position:fixed; inset:0; background:rgba(61,52,139,0.55); display:none; align-items:center; justify-content:center; padding:20px; z-index:10;
  }
  .overlay.show{ display:flex; }
  .win-card{ background:white; border-radius:24px; padding:26px 22px; text-align:center; max-width:320px; box-shadow:0 20px 40px rgba(0,0,0,0.2); }
  .win-card .big-emoji{ font-size:2.6rem; }
  button.btn{ font-family:'Baloo 2', cursive; font-size:0.95rem; border:none; border-radius:16px; padding:11px 20px; cursor:pointer; transition:transform .15s ease; margin-top:12px; }
  button.btn:active{ transform:scale(0.96); }
  .btn-primary{ background:var(--coral); color:white; width:100%; }
  .photo-row{ display:flex; flex-direction:column; align-items:center; gap:8px; margin-bottom:4px; }
  .btn-ghost{ background:#F0EEFC; color:var(--plum-soft); font-size:0.82rem; padding:8px 14px; margin-top:0; }
  .photo-preview-thumb{ width:52px; height:52px; border-radius:50%; object-fit:cover; box-shadow:0 4px 10px rgba(0,0,0,0.15); }
</style>
</head>
<body>
<div class="app">
  <div class="board-wrap" id="fieldWrap">
    <div class="board-box">
      <div class="hud-overlay">
        <div class="hud-left">
          <a href="../menu.html" class="backbtn" aria-label="Voltar ao menu"><span class="tc-arrow left dark"></span></a>
          <button class="backbtn fsbtn" id="btnFullscreen" aria-label="Tela cheia" type="button">⛶</button>
        </div>
        <div class="hud-stats">
          <span class="hud-badge">⚡ <b id="scoreNum">0</b></span>
          <span class="hud-badge">⏱️ <b id="timeNum">30</b>s</span>
          <span class="hud-badge">🏆 <b id="bestNum">0</b></span>
        </div>
      </div>
      <div class="field-wrap">
        <div class="field" id="field"></div>
      </div>
    </div>
  </div>
</div>

<div class="overlay show" id="startOverlay">
  <div class="win-card">
    <div class="big-emoji">⚡</div>
    <h2>Pronto pra pegar os raios?</h2>
    <p style="color:var(--plum-soft); font-weight:600;">Toque em quem aparecer assim que ele sair do buraco!</p>
    <div class="photo-row">
      <img id="photoPreviewImg" class="photo-preview-thumb" style="display:none;" alt="Foto escolhida">
      <button class="btn btn-ghost" id="btnPhoto">📷 Usar uma foto</button>
      <button class="btn btn-ghost" id="btnResetPhoto" style="display:none;">🎨 Usar nosso personagem</button>
    </div>
    <input type="file" id="photoInput" accept="image/*" style="display:none;">
    <button class="btn btn-primary" id="startBtn">Começar</button>
  </div>
</div>

<div class="overlay" id="overOverlay">
  <div class="win-card">
    <div class="big-emoji">🎉</div>
    <h2>Tempo esgotado!</h2>
    <p id="overStats" style="color:var(--plum-soft); font-weight:600;"></p>
    <button class="btn btn-primary" id="restartBtn">Jogar de novo 🔄</button>
  </div>
</div>

<script>
let audioCtx = null;
function getAudioCtx(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } } if(audioCtx.state==='suspended'){ audioCtx.resume(); } return audioCtx; }
function playTone(freq, startTime, duration, type, peakGain){
  const ctx = getAudioCtx(); if(!ctx) return;
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type || 'triangle'; osc.frequency.value = freq;
  const t0 = ctx.currentTime + startTime;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peakGain || 0.14, t0 + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + duration + 0.02);
}
function playCatch(){ playTone(700, 0, 0.09, 'triangle', 0.12); }
function playBonus(){ [700,940].forEach((f,i)=> playTone(f, i*0.06, 0.12, 'triangle', 0.13)); }
function playStart(){ [392,587.33].forEach((f,i)=> playTone(f, i*0.09, 0.2, 'triangle', 0.13)); }
function playEnd(){ [523.25,659.25,783.99].forEach((f,i)=> playTone(f, i*0.1, 0.25, 'triangle', 0.13)); }
function playBomb(){ [330,220,130].forEach((f,i)=> playTone(f, i*0.09, 0.28, 'sawtooth', 0.12)); }

function drawTDBase(c, color){
  c.beginPath(); c.arc(0,0,17,0,Math.PI*2); c.fillStyle = color; c.fill();
  c.strokeStyle = 'rgba(0,0,0,0.15)'; c.lineWidth = 2; c.stroke();
}
function drawTDEyes(c){
  c.fillStyle = '#2C2A4A';
  c.beginPath(); c.arc(-5,3,2.4,0,Math.PI*2); c.fill();
  c.beginPath(); c.arc(5,3,2.4,0,Math.PI*2); c.fill();
}
function drawPikachuTD(c){
  c.fillStyle = '#FFD166';
  c.beginPath(); c.moveTo(-13,-9); c.lineTo(-19,-21); c.lineTo(-7,-15); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(13,-9); c.lineTo(19,-21); c.lineTo(7,-15); c.closePath(); c.fill();
  c.fillStyle = '#2C2A4A';
  c.beginPath(); c.arc(-18,-20,2.2,0,Math.PI*2); c.fill();
  c.beginPath(); c.arc(18,-20,2.2,0,Math.PI*2); c.fill();
  drawTDBase(c, '#FFD166');
  drawTDEyes(c);
  c.fillStyle = '#FF5D6C';
  c.beginPath(); c.arc(-11,7,2.4,0,Math.PI*2); c.fill();
  c.beginPath(); c.arc(11,7,2.4,0,Math.PI*2); c.fill();
}
function renderCritterPNG(size){
  const cv = document.createElement('canvas'); cv.width = size; cv.height = size;
  const t = cv.getContext('2d');
  t.translate(size/2, size/2);
  t.scale(size/50, size/50);
  drawPikachuTD(t);
  return cv.toDataURL();
}
const DEFAULT_CRITTER_SRC = renderCritterPNG(140);
let CRITTER_SRC = DEFAULT_CRITTER_SRC;
let CRITTER_HTML = `<img class="critter" src="${CRITTER_SRC}" alt="Personagem">`;
const BOLT_HTML = `<span class="bolt">⚡</span>`;
const BOMB_HTML = `<span class="bolt">💣</span>`;

function setCritterPhoto(dataUrl, save){
  CRITTER_SRC = dataUrl;
  CRITTER_HTML = `<img class="critter is-photo" src="${CRITTER_SRC}" alt="Personagem">`;
  const preview = document.getElementById('photoPreviewImg');
  preview.src = dataUrl; preview.style.display = 'block';
  document.getElementById('btnResetPhoto').style.display = 'inline-block';
  if(save){ try{ localStorage.setItem('pegaraio_customPhoto', dataUrl); }catch(e){} }
}
function resetCritterPhoto(){
  CRITTER_SRC = DEFAULT_CRITTER_SRC;
  CRITTER_HTML = `<img class="critter" src="${CRITTER_SRC}" alt="Personagem">`;
  document.getElementById('photoPreviewImg').style.display = 'none';
  document.getElementById('btnResetPhoto').style.display = 'none';
  try{ localStorage.removeItem('pegaraio_customPhoto'); }catch(e){}
}
function loadSavedPhoto(){
  try{
    const saved = localStorage.getItem('pegaraio_customPhoto');
    if(saved) setCritterPhoto(saved, false);
  }catch(e){}
}
document.getElementById('btnPhoto').addEventListener('click', () => document.getElementById('photoInput').click());
document.getElementById('btnResetPhoto').addEventListener('click', resetCritterPhoto);
document.getElementById('photoInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const size = 200;
      const cv = document.createElement('canvas'); cv.width = size; cv.height = size;
      const cctx = cv.getContext('2d');
      const scale = Math.max(size/img.width, size/img.height);
      const dw = img.width*scale, dh = img.height*scale;
      cctx.drawImage(img, (size-dw)/2, (size-dh)/2, dw, dh);
      setCritterPhoto(cv.toDataURL('image/jpeg', 0.85), true);
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});
loadSavedPhoto();

const HOLE_COUNT = 9;
const field = document.getElementById('field');
let holes = [];
for(let i=0;i<HOLE_COUNT;i++){
  const h = document.createElement('button');
  h.className = 'hole';
  h.innerHTML = '<div class="pop"></div>';
  h.onclick = ()=> tapHole(i);
  field.appendChild(h);
  holes.push({ el:h, pop:h.querySelector('.pop'), active:false, type:null, hideTimer:null });
}

const fieldWrap = document.getElementById('fieldWrap');
function fitBoard(){
  const size = Math.max(180, Math.floor(Math.min(fieldWrap.clientWidth, fieldWrap.clientHeight)));
  field.style.width = size + 'px';
  field.style.height = size + 'px';
}
window.addEventListener('resize', fitBoard);
window.addEventListener('orientationchange', fitBoard);
fitBoard();

const fsBtn = document.getElementById('btnFullscreen');
const fsTarget = document.documentElement;
function isFullscreen(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function isIOS(){ return /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function isStandalone(){ return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; }
function toggleFullscreen(){
  const req = fsTarget.requestFullscreen || fsTarget.webkitRequestFullscreen;
  if(req){
    if(!isFullscreen()){ req.call(fsTarget); }
    else { const exit = document.exitFullscreen || document.webkitExitFullscreen; if(exit) exit.call(document); }
    return;
  }
  if(isIOS() && !isStandalone()){
    alert('No iPhone: toque no botao de compartilhar do Safari e escolha "Adicionar a Tela de Inicio". Assim o jogo abre em tela cheia.');
  }
}
fsBtn.addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', () => setTimeout(fitBoard, 60));
document.addEventListener('webkitfullscreenchange', () => setTimeout(fitBoard, 60));

let score, timeLeft, best, running, popScheduleTimer, tickInterval, lastHole;

function loadBest(){ try{ return parseInt(localStorage.getItem('pegaraio_best')||'0'); }catch(e){ return 0; } }
function saveBest(v){ try{ localStorage.setItem('pegaraio_best', String(v)); }catch(e){} }
best = loadBest();
document.getElementById('bestNum').textContent = best;

function hideHole(i){
  const h = holes[i];
  h.el.classList.remove('up');
  h.active = false;
  h.type = null;
  h.pop.innerHTML = '';
}

function popOne(){
  if(!running) return;
  let i = Math.floor(Math.random()*HOLE_COUNT);
  if(i === lastHole) i = (i+1) % HOLE_COUNT;
  lastHole = i;
  const h = holes[i];
  const roll = Math.random();
  h.type = roll < 0.14 ? 'bomb' : roll < 0.36 ? 'bonus' : 'critter';
  h.pop.innerHTML = h.type === 'bomb' ? BOMB_HTML : h.type === 'bonus' ? BOLT_HTML : CRITTER_HTML;
  h.el.classList.add('up');
  h.active = true;

  const showDuration = h.type === 'bomb' ? 650 : h.type === 'bonus' ? 550 : Math.max(480, 950 - score*8);
  h.hideTimer = setTimeout(()=>{
    if(h.active){ hideHole(i); scheduleNextPop(); }
  }, showDuration);
}

function scheduleNextPop(){
  if(!running) return;
  const delay = 250 + Math.random()*350;
  popScheduleTimer = setTimeout(popOne, delay);
}

function showCatchFx(i, kind, text){
  const row = Math.floor(i/3), col = i%3;
  const fx = document.createElement('div');
  fx.className = 'catch-fx' + (kind ? ' '+kind : '');
  fx.textContent = text;
  fx.style.left = ((col+0.5)/3*100) + '%';
  fx.style.top = ((row+0.5)/3*100) + '%';
  field.appendChild(fx);
  setTimeout(()=> fx.remove(), 800);
}

function tapHole(i){
  if(!running) return;
  const h = holes[i];
  if(!h.active) return;
  clearTimeout(h.hideTimer);

  if(h.type === 'bomb'){
    playBomb();
    showCatchFx(i, 'bomb', '💥');
    hideHole(i);
    setTimeout(()=> endGame(true), 400);
    return;
  }

  const isBonus = h.type === 'bonus';
  const gained = isBonus ? 3 : 1;
  score += gained;
  if(isBonus) playBonus(); else playCatch();
  document.getElementById('scoreNum').textContent = score;
  showCatchFx(i, isBonus ? 'bonus' : '', isBonus ? '+3 🌟' : '+1 ⚡');
  hideHole(i);
  scheduleNextPop();
}

function resetState(){
  score = 0; timeLeft = 30; lastHole = -1;
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('timeNum').textContent = timeLeft;
  holes.forEach((h,i)=>{ clearTimeout(h.hideTimer); hideHole(i); });
}

function startGame(){
  resetState();
  running = true;
  playStart();
  document.getElementById('startOverlay').classList.remove('show');
  document.getElementById('overOverlay').classList.remove('show');
  scheduleNextPop();
  tickInterval = setInterval(()=>{
    timeLeft--;
    document.getElementById('timeNum').textContent = Math.max(0, timeLeft);
    if(timeLeft <= 0) endGame();
  }, 1000);
}

function endGame(hitBomb){
  running = false;
  clearInterval(tickInterval);
  clearTimeout(popScheduleTimer);
  holes.forEach((h,i)=>{ clearTimeout(h.hideTimer); hideHole(i); });
  if(hitBomb){
    document.querySelector('#overOverlay .big-emoji').textContent = '💣';
    document.querySelector('#overOverlay h2').textContent = 'Bum! Pegou uma bomba!';
  } else {
    document.querySelector('#overOverlay .big-emoji').textContent = '🎉';
    document.querySelector('#overOverlay h2').textContent = 'Tempo esgotado!';
  }
  playEnd();
  if(score > best){ best = score; saveBest(best); document.getElementById('bestNum').textContent = best; }
  document.getElementById('overStats').textContent = `Você fez ${score} pontos!`;
  document.getElementById('overOverlay').classList.add('show');
}

document.getElementById('startBtn').onclick = startGame;
document.getElementById('restartBtn').onclick = startGame;
</script>
</body>
</html>

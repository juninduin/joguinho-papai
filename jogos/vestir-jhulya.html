<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Vestir a Jhulya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#EAF4FB; --card:#FFFFFF; --coral:#FF8B67; --yellow:#FFD166;
    --mint:#06D6A0; --plum:#3D348B; --plum-soft:#6C63AC; --ink:#2C2A4A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:
      radial-gradient(circle at 12% 15%, #FFE9F3 0%, transparent 45%),
      radial-gradient(circle at 88% 80%, #EAF6FF 0%, transparent 45%),
      var(--sky);
    font-family:'Quicksand', sans-serif; color:var(--ink);
    display:flex; flex-direction:column; align-items:center;
    padding:14px 14px 40px;
  }
  h1,h2,.display{ font-family:'Baloo 2', cursive; }
  .app{ width:100%; max-width:420px; }
  .topnav{ display:flex; align-items:center; margin-bottom:8px; }
  .backbtn{ width:40px; height:40px; border-radius:50%; background:white; display:flex; align-items:center; justify-content:center; font-size:1.2rem; color:var(--plum); text-decoration:none; box-shadow:0 4px 10px rgba(61,52,139,0.12); }
  header.top{ text-align:center; margin-bottom:14px; }
  header.top h1{ font-size:1.35rem; color:var(--plum); margin:4px 0 2px; }
  header.top p{ margin:0; color:var(--plum-soft); font-weight:600; font-size:0.85rem; }

  .stage{
    background:var(--card); border-radius:26px; padding:24px 10px 18px;
    box-shadow:0 14px 30px rgba(61,52,139,0.10); margin-bottom:16px;
  }
  .doll{ position:relative; width:190px; height:285px; margin:0 auto; }
  .doll-svg{ position:absolute; inset:0; width:100%; height:100%; }
  #outfitPath{ transition:fill .2s ease; }
  #shoeL, #shoeR{ transition:fill .2s ease; }
  .face-frame{
    position:absolute; z-index:3; top:0; left:50%; transform:translateX(-50%);
    width:92px; height:100px; border-radius:50%; overflow:hidden; border:5px solid white;
    box-shadow:0 6px 14px rgba(61,52,139,0.18); background:#FDEEDC;
  }
  .face-frame img{ width:100%; height:100%; object-fit:cover; object-position:center 28%; display:block; }
  .accessory{ position:absolute; z-index:4; top:-14px; left:50%; transform:translateX(-50%); font-size:2.1rem; }
  .held{ position:absolute; z-index:3; bottom:52px; right:-6px; font-size:1.7rem; }

  .opt-section{ margin-bottom:14px; }
  .opt-label{ font-family:'Baloo 2', cursive; color:var(--plum); font-size:0.92rem; margin:0 2px 8px; }
  .swatches{ display:flex; gap:10px; flex-wrap:wrap; }
  .swatch{
    width:42px; height:42px; border-radius:50%; border:3px solid transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:1.3rem;
    -webkit-tap-highlight-color:transparent; box-shadow:0 4px 8px rgba(61,52,139,0.12);
  }
  .swatch.emoji-swatch{ background:#F5F3FF; }
  .swatch.selected{ border-color:var(--plum); transform:scale(1.08); }
  .swatch.none-swatch{ background:#F5F3FF; color:var(--plum-soft); font-size:1.5rem; }
  .swatch.shape-swatch{
    width:auto; height:auto; border-radius:14px; padding:10px 14px; text-align:center;
    font-size:0.78rem; font-weight:700; font-family:'Baloo 2', cursive; line-height:1.15;
  }

  button.btn{ font-family:'Baloo 2', cursive; font-size:1rem; border:none; border-radius:16px; padding:13px 20px; cursor:pointer; transition:transform .15s ease; width:100%; }
  button.btn:active{ transform:scale(0.97); }
  .btn-primary{ background:var(--coral); color:white; }
</style>
</head>
<body>
<div class="app">
  <div class="topnav"><a href="../menu.html" class="backbtn" aria-label="Voltar ao menu">⬅</a></div>
  <header class="top">
    <h1>👗 Vestir a Jhulya</h1>
    <p>Escolha a roupa, os acessórios e monte o visual!</p>
  </header>

  <div class="stage">
    <div class="doll">
      <svg class="doll-svg" viewBox="0 0 190 285" xmlns="http://www.w3.org/2000/svg">
        <rect x="55" y="90" width="17" height="88" rx="8.5" transform="rotate(-12 63.5 90)" fill="#FFDBB4"/>
        <rect x="118" y="90" width="17" height="88" rx="8.5" transform="rotate(12 126.5 90)" fill="#FFDBB4"/>
        <rect x="74" y="176" width="19" height="84" rx="9.5" fill="#FFDBB4"/>
        <rect x="97" y="176" width="19" height="84" rx="9.5" fill="#FFDBB4"/>
        <rect x="85" y="76" width="20" height="18" rx="6" fill="#FFDBB4"/>
        <ellipse id="shoeL" cx="83.5" cy="260" rx="16" ry="9" fill="#8B5CF6"/>
        <ellipse id="shoeR" cx="106.5" cy="260" rx="16" ry="9" fill="#8B5CF6"/>
        <path id="outfitPath" fill="#FF6B9D" d=""/>
      </svg>
      <div class="face-frame"><img src="../pessoas/jhulya_real.jpg" alt="Jhulya"></div>
      <div class="accessory" id="accessoryEl"></div>
      <div class="held" id="heldEl"></div>
    </div>
  </div>

  <div class="opt-section">
    <div class="opt-label">✨ Estilo da roupa</div>
    <div class="swatches" id="shapeSwatches"></div>
  </div>
  <div class="opt-section">
    <div class="opt-label">👗 Cor da roupa</div>
    <div class="swatches" id="dressSwatches"></div>
  </div>
  <div class="opt-section">
    <div class="opt-label">👟 Sapatos</div>
    <div class="swatches" id="shoeSwatches"></div>
  </div>
  <div class="opt-section">
    <div class="opt-label">🎀 Acessório</div>
    <div class="swatches" id="accSwatches"></div>
  </div>
  <div class="opt-section">
    <div class="opt-label">🎒 Item</div>
    <div class="swatches" id="itemSwatches"></div>
  </div>

  <button class="btn btn-primary" id="randomBtn">🎲 Surpreenda-me!</button>
</div>

<script>
let audioCtx = null;
function getAudioCtx(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } } if(audioCtx.state==='suspended'){ audioCtx.resume(); } return audioCtx; }
function playTone(freq, startTime, duration, type, peakGain){
  const ctx = getAudioCtx(); if(!ctx) return;
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type || 'triangle'; osc.frequency.value = freq;
  const t0 = ctx.currentTime + startTime;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peakGain || 0.14, t0 + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + duration + 0.02);
}
function playClick(){ playTone(650, 0, 0.08, 'triangle', 0.1); }
function playRandom(){ [523.25,659.25,783.99].forEach((f,i)=> playTone(f, i*0.07, 0.16, 'triangle', 0.12)); }

const OUTFIT_SHAPES = {
  longo: { n:'Vestido longo', d:'M79,86 Q95,80 111,86 L140,230 Q95,248 50,230 Z' },
  rodado: { n:'Vestido rodado', d:'M79,86 Q95,80 111,86 L158,185 Q95,210 42,185 Z' },
  shorts: { n:'Short e blusa', d:'M83,86 Q95,81 107,86 L118,150 Q95,160 72,150 Z M72,176 L124,176 L118,208 Q95,216 72,208 Z' },
  calca:  { n:'Calça e camiseta', d:'M83,86 Q95,81 107,86 L120,160 Q95,172 70,160 Z M71,178 L96,178 L92,254 Q83,260 75,254 Z M99,178 L124,178 L120,254 Q111,260 103,254 Z' }
};
const DRESS_COLORS = ['#FF6B9D','#8B5CF6','#4C9BE8','#06D6A0','#FFD166','#FF8B67'];
const SHOE_COLORS = ['#8B5CF6','#FF6B9D','#4C9BE8','#2C2A4A','#FFD166','#FF8B67'];
const ACCESSORIES = [{e:'🎀',n:'Laço'},{e:'👑',n:'Coroa'},{e:'🌸',n:'Florzinha'},{e:'🧢',n:'Boné'},{e:'',n:'Nenhum'}];
const ITEMS = [{e:'👜',n:'Bolsinha'},{e:'🧸',n:'Ursinho'},{e:'🎈',n:'Balão'},{e:'🍦',n:'Sorvete'},{e:'',n:'Nenhum'}];

let outfit = { shape:'longo', dress: DRESS_COLORS[0], shoe: SHOE_COLORS[0], acc: ACCESSORIES[0].e, item: ITEMS[0].e };

function loadOutfit(){ try{ return JSON.parse(localStorage.getItem('vestir_jhulya')||'{}'); }catch(e){ return {}; } }
function saveOutfit(){ try{ localStorage.setItem('vestir_jhulya', JSON.stringify(outfit)); }catch(e){} }
outfit = { ...outfit, ...loadOutfit() };

function applyOutfit(){
  document.getElementById('outfitPath').setAttribute('d', OUTFIT_SHAPES[outfit.shape].d);
  document.getElementById('outfitPath').setAttribute('fill', outfit.dress);
  document.getElementById('shoeL').setAttribute('fill', outfit.shoe);
  document.getElementById('shoeR').setAttribute('fill', outfit.shoe);
  document.getElementById('accessoryEl').textContent = outfit.acc;
  document.getElementById('heldEl').textContent = outfit.item;
}

function renderShapeSwatches(){
  const el = document.getElementById('shapeSwatches');
  el.innerHTML = '';
  Object.keys(OUTFIT_SHAPES).forEach(key=>{
    const sw = document.createElement('div');
    sw.className = 'swatch shape-swatch' + (outfit.shape===key ? ' selected' : '');
    sw.style.background = '#F5F3FF';
    sw.style.color = 'var(--plum)';
    sw.textContent = OUTFIT_SHAPES[key].n;
    sw.onclick = ()=>{ outfit.shape=key; playClick(); saveOutfit(); applyOutfit(); renderAll(); };
    el.appendChild(sw);
  });
}

function renderColorSwatches(containerId, colors, key){
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  colors.forEach(c=>{
    const sw = document.createElement('div');
    sw.className = 'swatch' + (outfit[key]===c ? ' selected' : '');
    sw.style.background = c;
    sw.onclick = ()=>{ outfit[key]=c; playClick(); saveOutfit(); applyOutfit(); renderAll(); };
    el.appendChild(sw);
  });
}

function renderEmojiSwatches(containerId, options, key){
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  options.forEach(o=>{
    const sw = document.createElement('div');
    sw.className = 'swatch ' + (o.e ? 'emoji-swatch' : 'none-swatch') + (outfit[key]===o.e ? ' selected' : '');
    sw.textContent = o.e || '🚫';
    sw.title = o.n;
    sw.onclick = ()=>{ outfit[key]=o.e; playClick(); saveOutfit(); applyOutfit(); renderAll(); };
    el.appendChild(sw);
  });
}

function renderAll(){
  renderShapeSwatches();
  renderColorSwatches('dressSwatches', DRESS_COLORS, 'dress');
  renderColorSwatches('shoeSwatches', SHOE_COLORS, 'shoe');
  renderEmojiSwatches('accSwatches', ACCESSORIES, 'acc');
  renderEmojiSwatches('itemSwatches', ITEMS, 'item');
}

document.getElementById('randomBtn').onclick = ()=>{
  const shapeKeys = Object.keys(OUTFIT_SHAPES);
  outfit.shape = shapeKeys[Math.floor(Math.random()*shapeKeys.length)];
  outfit.dress = DRESS_COLORS[Math.floor(Math.random()*DRESS_COLORS.length)];
  outfit.shoe = SHOE_COLORS[Math.floor(Math.random()*SHOE_COLORS.length)];
  outfit.acc = ACCESSORIES[Math.floor(Math.random()*ACCESSORIES.length)].e;
  outfit.item = ITEMS[Math.floor(Math.random()*ITEMS.length)].e;
  playRandom();
  saveOutfit();
  applyOutfit();
  renderAll();
};

applyOutfit();
renderAll();
</script>
</body>
</html>

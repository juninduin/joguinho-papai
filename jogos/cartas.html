<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Jogo de Combinar Cartas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#EAF4FB; --card:#FFFFFF; --coral:#FF8B67; --yellow:#FFD166;
    --mint:#06D6A0; --plum:#3D348B; --plum-soft:#6C63AC; --ink:#2C2A4A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:
      radial-gradient(circle at 12% 15%, #DCEEFB 0%, transparent 40%),
      radial-gradient(circle at 88% 80%, #FDE9DC 0%, transparent 45%),
      var(--sky);
    font-family:'Quicksand', sans-serif; color:var(--ink);
    display:flex; flex-direction:column; align-items:center;
    padding:16px 14px 50px;
  }
  h1,h2,.display{ font-family:'Baloo 2', cursive; }
  .app{ width:100%; max-width:560px; }
  .topnav{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .backbtn{ width:42px; height:42px; border-radius:50%; background:white; display:flex; align-items:center; justify-content:center; font-size:1.3rem; color:var(--plum); text-decoration:none; box-shadow:0 4px 10px rgba(61,52,139,0.12); }
  header.top{ text-align:center; margin-bottom:14px; }
  header.top h1{ font-size:1.5rem; color:var(--plum); margin:4px 0 2px; }
  header.top p{ margin:0; color:var(--plum-soft); font-weight:600; font-size:0.9rem; }
  .stats{ display:flex; justify-content:space-around; margin-bottom:14px; }
  .stat{ text-align:center; }
  .stat .num{ font-family:'Baloo 2', cursive; font-size:1.3rem; color:var(--coral); }
  .stat .lbl{ font-size:0.78rem; color:var(--plum-soft); font-weight:600; }
  .card-box{ background:var(--card); border-radius:26px; padding:24px 20px 26px; box-shadow:0 14px 30px rgba(61,52,139,0.10); text-align:center; }
  .target-card{
    background:#F5F3FF; border-radius:22px; padding:22px 16px; margin-bottom:20px;
  }
  .target-card .emoji{ font-size:4rem; display:block; }
  .target-card .label{ font-family:'Baloo 2', cursive; color:var(--plum); font-size:1.1rem; margin-top:6px; }
  .prompt{ color:var(--plum-soft); font-weight:700; margin-bottom:14px; font-size:0.95rem; }
  .opts{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .opt{
    border:3px solid transparent; background:#F8F7FD; border-radius:18px; padding:18px 8px;
    cursor:pointer; font-size:2.4rem; transition:transform .15s ease, border-color .15s ease, background .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{ transform:scale(0.95); }
  .opt.correct{ border-color:var(--mint); background:#E3FBF3; }
  .opt.wrong{ border-color:#FF6B6B; background:#FFEAEA; }
  .feedback{ min-height:28px; font-family:'Baloo 2', cursive; color:var(--mint); margin-top:14px; font-size:1.05rem; }
  .win{ text-align:center; }
  .win .big-emoji{ font-size:3rem; }
  button.btn{ font-family:'Baloo 2', cursive; font-size:1rem; border:none; border-radius:16px; padding:12px 20px; cursor:pointer; transition:transform .15s ease; }
  button.btn:active{ transform:scale(0.96); }
  .btn-primary{ background:var(--coral); color:white; width:100%; margin-top:14px; }
</style>
</head>
<body>
<div class="app">
  <div class="topnav"><a href="../menu.html" class="backbtn" aria-label="Voltar ao menu">⬅</a></div>
  <header class="top">
    <h1>🃏 Combine as Cartas</h1>
    <p id="subheader">Encontre a carta que combina certinho!</p>
  </header>

  <div class="stats">
    <div class="stat"><div class="num" id="scoreNum">0</div><div class="lbl">Acertos</div></div>
    <div class="stat"><div class="num" id="roundNum">1/10</div><div class="lbl">Rodada</div></div>
  </div>

  <div class="card-box" id="gameArea">
    <div class="target-card">
      <span class="emoji" id="targetEmoji">🐶</span>
      <span class="label" id="targetLabel">Cachorro</span>
    </div>
    <p class="prompt" id="promptText">Qual carta combina com essa?</p>
    <div class="opts" id="optsGrid"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="card-box win" id="winScreen" style="display:none;">
    <div class="big-emoji">🏆</div>
    <h2>Muito bem!</h2>
    <p id="winStats" style="color:var(--plum-soft); font-weight:600;"></p>
    <button class="btn btn-primary" id="playAgainBtn">Jogar de novo 🔄</button>
  </div>
</div>

<script>
let audioCtx = null;
function getAudioCtx(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } } if(audioCtx.state==='suspended'){ audioCtx.resume(); } return audioCtx; }
function playTone(freq, startTime, duration, type, peakGain){
  const ctx = getAudioCtx(); if(!ctx) return;
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type || 'triangle'; osc.frequency.value = freq;
  const t0 = ctx.currentTime + startTime;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peakGain || 0.14, t0 + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + duration + 0.02);
}
function playCorrect(){ [523.25,659.25,783.99].forEach((f,i)=> playTone(f, i*0.08, 0.2, 'triangle', 0.13)); }
function playWrong(){ playTone(220, 0, 0.16, 'sine', 0.08); }
function playWin(){ [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=> playTone(f, i*0.1, 0.3, 'triangle', 0.14)); }

// Pares: cada item combina com seu par (animal -> som / filhote / lar), tema "o que combina com o quê"
const PAIRS = [
  {a:{e:'🐶',l:'Cachorro'}, b:{e:'🦴',l:'Osso'}},
  {a:{e:'🐱',l:'Gato'}, b:{e:'🧶',l:'Novelo'}},
  {a:{e:'🐝',l:'Abelha'}, b:{e:'🍯',l:'Mel'}},
  {a:{e:'🐄',l:'Vaca'}, b:{e:'🥛',l:'Leite'}},
  {a:{e:'🐔',l:'Galinha'}, b:{e:'🥚',l:'Ovo'}},
  {a:{e:'🐟',l:'Peixe'}, b:{e:'🐠',l:'Aquário'}},
  {a:{e:'🐦',l:'Passarinho'}, b:{e:'🪺',l:'Ninho'}},
  {a:{e:'🐰',l:'Coelho'}, b:{e:'🥕',l:'Cenoura'}},
  {a:{e:'🐻',l:'Urso'}, b:{e:'🍯',l:'Mel de urso'}},
  {a:{e:'☔',l:'Chuva'}, b:{e:'🌂',l:'Guarda-chuva'}},
  {a:{e:'☀️',l:'Sol'}, b:{e:'🕶️',l:'Óculos de sol'}},
  {a:{e:'🦶',l:'Pé'}, b:{e:'👟',l:'Tênis'}},
  {a:{e:'✋',l:'Mão'}, b:{e:'🧤',l:'Luva'}},
  {a:{e:'🦷',l:'Dente'}, b:{e:'🪥',l:'Escova de dente'}},
];

const TOTAL_ROUNDS = 10;
let round = 0, score = 0, order = [];

function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function startGame(){
  round = 0; score = 0;
  order = shuffle(PAIRS).slice(0, TOTAL_ROUNDS);
  document.getElementById('gameArea').style.display='block';
  document.getElementById('winScreen').style.display='none';
  nextRound();
}

function nextRound(){
  if(round >= order.length){ return showWin(); }
  const pair = order[round];
  document.getElementById('targetEmoji').textContent = pair.a.e;
  document.getElementById('targetLabel').textContent = pair.a.l;
  document.getElementById('roundNum').textContent = (round+1) + '/' + order.length;
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('feedback').textContent = '';

  // gera 4 opções: a correta + 3 erradas de outros pares
  const others = shuffle(PAIRS.filter(p => p !== pair && p.b.e !== pair.b.e)).slice(0,3).map(p=>p.b);
  const opts = shuffle([pair.b, ...others]);

  const grid = document.getElementById('optsGrid');
  grid.innerHTML = '';
  opts.forEach(opt=>{
    const div = document.createElement('div');
    div.className = 'opt';
    div.textContent = opt.e;
    div.onclick = ()=> chooseOpt(div, opt, pair.b);
    grid.appendChild(div);
  });
}

let locked = false;
function chooseOpt(el, chosen, correct){
  if(locked) return;
  locked = true;
  if(chosen.e === correct.e){
    el.classList.add('correct');
    score++;
    playCorrect();
    document.getElementById('feedback').textContent = 'Isso aí! 🎉';
    document.getElementById('scoreNum').textContent = score;
  } else {
    el.classList.add('wrong');
    playWrong();
    document.getElementById('feedback').textContent = `Quase! Combina com ${correct.e}`;
    [...document.getElementById('optsGrid').children].forEach(c=>{
      if(c.textContent === correct.e) c.classList.add('correct');
    });
  }
  setTimeout(()=>{
    locked = false;
    round++;
    nextRound();
  }, 1100);
}

function showWin(){
  playWin();
  document.getElementById('gameArea').style.display='none';
  document.getElementById('winScreen').style.display='block';
  document.getElementById('winStats').textContent = `Você acertou ${score} de ${order.length}!`;
}

document.getElementById('playAgainBtn').onclick = startGame;

startGame();
</script>
</body>
</html>

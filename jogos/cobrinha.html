<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Jogo da Cobrinha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#EAF4FB; --card:#FFFFFF; --coral:#FF8B67; --yellow:#FFD166;
    --mint:#06D6A0; --plum:#3D348B; --plum-soft:#6C63AC; --ink:#2C2A4A;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0; height:100vh; height:100svh; overflow:hidden;
    background:
      radial-gradient(circle at 12% 15%, #DCEEFB 0%, transparent 40%),
      radial-gradient(circle at 88% 80%, #FDE9DC 0%, transparent 45%),
      var(--sky);
    font-family:'Quicksand', sans-serif; color:var(--ink);
    display:flex; flex-direction:column; align-items:center;
    padding:8px 10px; touch-action:none;
  }
  h1,h2,.display{ font-family:'Baloo 2', cursive; }
  .app{ width:100%; max-width:420px; height:100%; display:flex; flex-direction:column; min-height:0; }
  .topnav{ display:flex; align-items:center; margin-bottom:4px; flex:0 0 auto; }
  .backbtn{ width:36px; height:36px; border-radius:50%; background:white; display:flex; align-items:center; justify-content:center; font-size:1.1rem; color:var(--plum); text-decoration:none; box-shadow:0 4px 10px rgba(61,52,139,0.12); }
  header.top{ text-align:center; margin-bottom:4px; flex:0 0 auto; }
  header.top h1{ font-size:1.05rem; color:var(--plum); margin:0; }
  header.top p{ margin:0; color:var(--plum-soft); font-weight:600; font-size:0.72rem; }
  .stats{ display:flex; justify-content:space-around; margin-bottom:6px; flex:0 0 auto; }
  .stat{ text-align:center; }
  .stat .num{ font-family:'Baloo 2', cursive; font-size:1rem; color:var(--coral); line-height:1.1; }
  .stat .lbl{ font-size:0.65rem; color:var(--plum-soft); font-weight:600; }
  .board-wrap{ flex:1 1 auto; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .board-box{ position:relative; border-radius:18px; overflow:hidden; box-shadow:0 14px 30px rgba(61,52,139,0.14); background:#DDF3D8; }
  canvas{ width:100%; height:100%; display:block; }
  .overlay{
    position:absolute; inset:0; background:rgba(61,52,139,0.55); display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; color:white; padding:14px;
  }
  .overlay .big-emoji{ font-size:2.2rem; margin-bottom:2px; }
  .overlay h2{ margin:2px 0; font-size:1.05rem; }
  .overlay p{ margin:0 0 8px; font-weight:600; font-size:0.8rem; }
  button.btn{ font-family:'Baloo 2', cursive; font-size:0.9rem; border:none; border-radius:14px; padding:9px 18px; cursor:pointer; transition:transform .15s ease; }
  button.btn:active{ transform:scale(0.96); }
  .btn-primary{ background:var(--coral); color:white; }
  .dpad{ display:grid; grid-template-columns:50px 50px 50px; grid-template-rows:50px 50px 50px; gap:4px; justify-content:center; margin:6px auto 0; flex:0 0 auto; }
  .dbtn{ background:white; border:none; border-radius:13px; font-size:1.2rem; box-shadow:0 6px 14px rgba(61,52,139,0.12); cursor:pointer; color:var(--plum); -webkit-tap-highlight-color:transparent; }
  .dbtn:active{ transform:scale(0.92); background:#F0EEFC; }
  .dup{ grid-column:2; grid-row:1; }
  .dleft{ grid-column:1; grid-row:2; }
  .dright{ grid-column:3; grid-row:2; }
  .ddown{ grid-column:2; grid-row:3; }

  @media (orientation:landscape) and (max-height:520px){
    .app{ flex-direction:row; align-items:stretch; max-width:100%; gap:10px; }
    .hud{ flex:0 0 auto; width:78px; display:flex; flex-direction:column; justify-content:flex-start; }
    header.top p{ display:none; }
    header.top h1{ font-size:0.82rem; }
    .stats{ flex-direction:column; gap:4px; }
    .board-wrap{ flex:1 1 auto; }
    .dpad{ flex:0 0 auto; align-self:center; margin:0; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="hud">
  <div class="topnav"><a href="../menu.html" class="backbtn" aria-label="Voltar ao menu">⬅</a></div>
  <header class="top">
    <h1>🐍 Jogo da Cobrinha</h1>
    <p>Coma as maçãs e não bata na parede!</p>
  </header>

  <div class="stats">
    <div class="stat"><div class="num" id="scoreNum">0</div><div class="lbl">Pontos</div></div>
    <div class="stat"><div class="num" id="bestNum">0</div><div class="lbl">Recorde</div></div>
  </div>
  </div>

  <div class="board-wrap" id="boardWrap">
    <div class="board-box" id="boardBox">
      <canvas id="board" width="320" height="320"></canvas>
      <div class="overlay" id="startOverlay">
        <div class="big-emoji">🐍</div>
        <h2>Pronto pra jogar?</h2>
        <p>Use as setinhas para mover a cobrinha</p>
        <button class="btn btn-primary" id="startBtn">Começar 🍎</button>
      </div>
      <div class="overlay" id="overOverlay" style="display:none;">
        <div class="big-emoji">😊</div>
        <h2>Ops! Vamos de novo?</h2>
        <p id="overStats"></p>
        <button class="btn btn-primary" id="restartBtn">Jogar de novo 🔄</button>
      </div>
    </div>
  </div>

  <div class="dpad">
    <button class="dbtn dup" id="btnUp">⬆️</button>
    <button class="dbtn dleft" id="btnLeft">⬅️</button>
    <button class="dbtn dright" id="btnRight">➡️</button>
    <button class="dbtn ddown" id="btnDown">⬇️</button>
  </div>
</div>

<script>
let audioCtx = null;
function getAudioCtx(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } } if(audioCtx.state==='suspended'){ audioCtx.resume(); } return audioCtx; }
function playTone(freq, startTime, duration, type, peakGain){
  const ctx = getAudioCtx(); if(!ctx) return;
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type || 'triangle'; osc.frequency.value = freq;
  const t0 = ctx.currentTime + startTime;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peakGain || 0.14, t0 + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + duration + 0.02);
}
function playEat(){ [660,880].forEach((f,i)=> playTone(f, i*0.06, 0.14, 'triangle', 0.13)); }
function playStart(){ [392,587.33].forEach((f,i)=> playTone(f, i*0.09, 0.2, 'triangle', 0.13)); }
function playOver(){ [392,330,262].forEach((f,i)=> playTone(f, i*0.12, 0.22, 'sine', 0.11)); }

const COLS = 16, ROWS = 16, CELL = 20;
const canvas = document.getElementById('board');
const ctx2d = canvas.getContext('2d');
const boardWrap = document.getElementById('boardWrap');
const boardBox = document.getElementById('boardBox');

function fitBoard(){
  const w = boardWrap.clientWidth;
  const h = boardWrap.clientHeight;
  const size = Math.max(120, Math.floor(Math.min(w, h)));
  boardBox.style.width = size + 'px';
  boardBox.style.height = size + 'px';
}
window.addEventListener('resize', fitBoard);
window.addEventListener('orientationchange', fitBoard);

let snake, dir, nextDir, food, score, best, tickMs, timer, running;

function loadBest(){ try{ return parseInt(localStorage.getItem('cobrinha_best')||'0'); }catch(e){ return 0; } }
function saveBest(v){ try{ localStorage.setItem('cobrinha_best', String(v)); }catch(e){} }
best = loadBest();
document.getElementById('bestNum').textContent = best;

function resetState(){
  snake = [{x:7,y:8},{x:6,y:8},{x:5,y:8}];
  dir = {x:1,y:0}; nextDir = {x:1,y:0};
  score = 0; tickMs = 220;
  food = randomFood();
  document.getElementById('scoreNum').textContent = score;
}

function randomFood(){
  let p;
  do{ p = {x:Math.floor(Math.random()*COLS), y:Math.floor(Math.random()*ROWS)}; }
  while(snake.some(s=>s.x===p.x && s.y===p.y));
  return p;
}

function setDir(x,y){
  if(!running) return;
  if(snake.length>1 && dir.x===-x && dir.y===-y) return; // não deixa voltar sobre si mesma
  nextDir = {x,y};
}

document.getElementById('btnUp').onclick = ()=>setDir(0,-1);
document.getElementById('btnDown').onclick = ()=>setDir(0,1);
document.getElementById('btnLeft').onclick = ()=>setDir(-1,0);
document.getElementById('btnRight').onclick = ()=>setDir(1,0);
window.addEventListener('keydown', (e)=>{
  const k = e.key;
  if(k==='ArrowUp'||k==='w') setDir(0,-1);
  else if(k==='ArrowDown'||k==='s') setDir(0,1);
  else if(k==='ArrowLeft'||k==='a') setDir(-1,0);
  else if(k==='ArrowRight'||k==='d') setDir(1,0);
});

function tick(){
  dir = nextDir;
  const head = {x: snake[0].x+dir.x, y: snake[0].y+dir.y};
  if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS || snake.some(s=>s.x===head.x&&s.y===head.y)){
    return gameOver();
  }
  snake.unshift(head);
  if(head.x===food.x && head.y===food.y){
    score++; playEat();
    document.getElementById('scoreNum').textContent = score;
    food = randomFood();
    if(tickMs > 110){ tickMs -= 4; restartTimer(); }
  } else {
    snake.pop();
  }
  draw();
}

function restartTimer(){
  clearInterval(timer);
  timer = setInterval(tick, tickMs);
}

function draw(){
  ctx2d.clearRect(0,0,canvas.width,canvas.height);
  ctx2d.fillStyle = '#DDF3D8';
  ctx2d.fillRect(0,0,canvas.width,canvas.height);
  // food
  ctx2d.font = (CELL-2) + 'px serif';
  ctx2d.textAlign = 'center'; ctx2d.textBaseline = 'middle';
  ctx2d.fillText('🍎', food.x*CELL+CELL/2, food.y*CELL+CELL/2+1);
  // snake
  snake.forEach((s,i)=>{
    ctx2d.fillStyle = i===0 ? '#FF8B67' : '#FFB199';
    const pad = 2;
    roundRect(ctx2d, s.x*CELL+pad, s.y*CELL+pad, CELL-pad*2, CELL-pad*2, 6);
    ctx2d.fill();
  });
}
function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

function startGame(){
  resetState();
  running = true;
  playStart();
  document.getElementById('startOverlay').style.display='none';
  document.getElementById('overOverlay').style.display='none';
  draw();
  clearInterval(timer);
  timer = setInterval(tick, tickMs);
}

function gameOver(){
  running = false;
  clearInterval(timer);
  playOver();
  if(score > best){ best = score; saveBest(best); document.getElementById('bestNum').textContent = best; }
  document.getElementById('overStats').textContent = `Você comeu ${score} maçã${score===1?'':'s'}!`;
  document.getElementById('overOverlay').style.display='flex';
}

document.getElementById('startBtn').onclick = startGame;
document.getElementById('restartBtn').onclick = startGame;

fitBoard();
resetState();
draw();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Jogo da Cobrinha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#EAF4FB; --card:#FFFFFF; --coral:#FF8B67; --yellow:#FFD166;
    --mint:#06D6A0; --plum:#3D348B; --plum-soft:#6C63AC; --ink:#2C2A4A;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0; height:100vh; height:100svh; overflow:hidden;
    background:
      radial-gradient(circle at 12% 15%, #DCEEFB 0%, transparent 40%),
      radial-gradient(circle at 88% 80%, #FDE9DC 0%, transparent 45%),
      var(--sky);
    font-family:'Quicksand', sans-serif; color:var(--ink);
    display:flex; flex-direction:column; align-items:center;
    padding:0; touch-action:none;
  }
  h1,h2,.display{ font-family:'Baloo 2', cursive; }
  .app{ width:100%; height:100%; display:flex; flex-direction:column; min-height:0; }

  .backbtn{
    width:32px; height:32px; border-radius:10px; background:white; border:3px solid #16214a;
    display:flex; align-items:center; justify-content:center; text-decoration:none;
    box-shadow:0 3px 0 #16214a; flex:0 0 auto; pointer-events:auto; transition:transform .1s ease, box-shadow .1s ease;
  }
  .backbtn:active{ transform:translateY(2px); box-shadow:none; }
  .fsbtn{ font-size:1rem; color:var(--plum); cursor:pointer; }
  .tc-arrow{ width:0; height:0; pointer-events:none; }
  .tc-arrow.left{ border-top:8px solid transparent; border-bottom:8px solid transparent; border-right:11px solid white; margin-left:-2px; }
  .tc-arrow.dark.left{ border-right-color:#16214a; }

  .hud-overlay{
    position:absolute; z-index:4;
    top:calc(14px + env(safe-area-inset-top, 0px));
    left:calc(14px + env(safe-area-inset-left, 0px));
    right:calc(14px + env(safe-area-inset-right, 0px));
    display:flex; align-items:flex-start; justify-content:space-between; gap:6px; pointer-events:none;
  }
  .hud-left{ display:flex; align-items:center; gap:6px; pointer-events:none; }
  .hud-stats{ display:flex; align-items:center; gap:6px; pointer-events:none; }
  .hud-badge{
    display:flex; align-items:center; gap:5px; background:white; border-radius:999px; padding:5px 12px;
    box-shadow:0 3px 8px rgba(61,52,139,0.16); font-family:'Baloo 2', cursive; font-size:0.85rem; color:var(--plum);
    white-space:nowrap;
  }

  .board-wrap{ flex:1 1 auto; min-height:0; width:100%; overflow:hidden; }
  .board-box{ position:relative; width:100%; height:100%; overflow:hidden; background:#DDF3D8; }
  canvas{ width:100%; height:100%; display:block; }

  .touch-ctrls{ position:absolute; inset:0; pointer-events:none; }
  .dpad{
    position:absolute; right:calc(20px + env(safe-area-inset-right, 0px)); bottom:calc(24px + env(safe-area-inset-bottom, 0px));
    display:grid; grid-template-columns:52px 52px 52px; grid-template-rows:52px 52px 52px; gap:6px;
  }
  .dbtn{
    background:linear-gradient(180deg, #FFFFFF 0%, #F0EEFC 100%); border:3px solid #16214a; border-radius:13px;
    font-size:1.3rem; box-shadow:0 4px 0 #16214a; cursor:pointer; color:var(--plum);
    -webkit-tap-highlight-color:transparent; pointer-events:auto; transition:transform .1s ease, box-shadow .1s ease;
  }
  .dbtn:active{ transform:translateY(3px); box-shadow:none; }
  .dup{ grid-column:2; grid-row:1; } .dleft{ grid-column:1; grid-row:2; }
  .dright{ grid-column:3; grid-row:2; } .ddown{ grid-column:2; grid-row:3; }

  .overlay{
    position:absolute; inset:0; background:rgba(61,52,139,0.6); display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; color:white; padding:16px; z-index:10;
  }
  .overlay .big-emoji{ font-size:2.4rem; margin-bottom:2px; }
  .overlay h2{ margin:2px 0; font-size:1.15rem; }
  .overlay p{ margin:0 0 10px; font-weight:600; font-size:0.85rem; }
  button.btn{ font-family:'Baloo 2', cursive; font-size:0.95rem; border:none; border-radius:14px; padding:11px 20px; cursor:pointer; box-shadow:0 6px 14px rgba(61,52,139,0.25); transition:transform .12s ease; }
  button.btn:active{ transform:scale(0.96); }
  .btn-primary{ background:linear-gradient(180deg, #FFA588 0%, var(--coral) 100%); color:white; }

  .rotate-hint{ position:fixed; bottom:10px; left:50%; transform:translateX(-50%); font-size:0.7rem; color:var(--plum-soft); font-weight:700; opacity:0; pointer-events:none; }
</style>
</head>
<body>
<div class="app">
  <div class="board-wrap" id="boardWrap">
    <div class="board-box" id="boardBox">
      <canvas id="board"></canvas>

      <div class="hud-overlay">
        <div class="hud-left">
          <a href="../menu.html" class="backbtn" aria-label="Voltar ao menu"><span class="tc-arrow left dark"></span></a>
          <button class="backbtn fsbtn" id="btnFullscreen" aria-label="Tela cheia" type="button">⛶</button>
        </div>
        <div class="hud-stats">
          <span class="hud-badge">🍎 <b id="scoreNum">0</b></span>
          <span class="hud-badge">🏆 <b id="bestNum">0</b></span>
        </div>
      </div>

      <div class="touch-ctrls">
        <div class="dpad">
          <button class="dbtn dup" id="btnUp">⬆️</button>
          <button class="dbtn dleft" id="btnLeft">⬅️</button>
          <button class="dbtn dright" id="btnRight">➡️</button>
          <button class="dbtn ddown" id="btnDown">⬇️</button>
        </div>
      </div>

      <div class="overlay" id="startOverlay">
        <div class="big-emoji">🐍</div>
        <h2>Jogo da Cobrinha</h2>
        <p>Coma as maçãs e não bata na parede!</p>
        <button class="btn btn-primary" id="startBtn">Começar 🍎</button>
      </div>
      <div class="overlay" id="overOverlay" style="display:none;">
        <div class="big-emoji">😊</div>
        <h2>Ops! Vamos de novo?</h2>
        <p id="overStats"></p>
        <button class="btn btn-primary" id="restartBtn">Jogar de novo 🔄</button>
      </div>
    </div>
  </div>
</div>

<script>
let audioCtx = null;
function getAudioCtx(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } } if(audioCtx.state==='suspended'){ audioCtx.resume(); } return audioCtx; }
function playTone(freq, startTime, duration, type, peakGain){
  const ctx = getAudioCtx(); if(!ctx) return;
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type || 'triangle'; osc.frequency.value = freq;
  const t0 = ctx.currentTime + startTime;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peakGain || 0.14, t0 + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + duration + 0.02);
}
function playEat(){ [660,880].forEach((f,i)=> playTone(f, i*0.06, 0.14, 'triangle', 0.13)); }
function playStart(){ [392,587.33].forEach((f,i)=> playTone(f, i*0.09, 0.2, 'triangle', 0.13)); }
function playOver(){ [392,330,262].forEach((f,i)=> playTone(f, i*0.12, 0.22, 'sine', 0.11)); }

const canvas = document.getElementById('board');
const ctx2d = canvas.getContext('2d');
const boardWrap = document.getElementById('boardWrap');
const boardBox = document.getElementById('boardBox');

const CELL = 24;
let COLS = 14, ROWS = 14, PX_W = COLS*CELL, PX_H = ROWS*CELL;

function fitBoard(){
  const w = boardBox.clientWidth, h = boardBox.clientHeight;
  if(w <= 0 || h <= 0) return;
  const newCols = Math.max(9, Math.floor(w / CELL));
  const newRows = Math.max(9, Math.floor(h / CELL));
  if(newCols !== COLS || newRows !== ROWS){
    COLS = newCols; ROWS = newRows;
    PX_W = COLS*CELL; PX_H = ROWS*CELL;
    canvas.width = PX_W; canvas.height = PX_H;
    if(typeof snake !== 'undefined' && snake){
      snake = snake.filter(s => s.x < COLS && s.y < ROWS);
      if(!snake.length) snake = [{x:Math.floor(COLS/2), y:Math.floor(ROWS/2)}];
      if(food && (food.x >= COLS || food.y >= ROWS)) food = randomFood();
    }
  } else {
    canvas.width = PX_W; canvas.height = PX_H;
  }
  if(typeof draw === 'function') draw();
}
window.addEventListener('resize', fitBoard);
window.addEventListener('orientationchange', fitBoard);

const fsBtn = document.getElementById('btnFullscreen');
const fsTarget = document.documentElement;
function isFullscreen(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function isIOS(){ return /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function isStandalone(){ return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; }
function toggleFullscreen(){
  const req = fsTarget.requestFullscreen || fsTarget.webkitRequestFullscreen;
  if(req){
    if(!isFullscreen()){ req.call(fsTarget); }
    else { const exit = document.exitFullscreen || document.webkitExitFullscreen; if(exit) exit.call(document); }
    return;
  }
  if(isIOS() && !isStandalone()){
    alert('No iPhone: toque no botao de compartilhar do Safari e escolha "Adicionar a Tela de Inicio". Assim o jogo abre em tela cheia.');
  }
}
fsBtn.addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', () => setTimeout(fitBoard, 60));
document.addEventListener('webkitfullscreenchange', () => setTimeout(fitBoard, 60));

let snake, dir, nextDir, food, score, best, tickMs, timer, running;

function loadBest(){ try{ return parseInt(localStorage.getItem('cobrinha_best')||'0'); }catch(e){ return 0; } }
function saveBest(v){ try{ localStorage.setItem('cobrinha_best', String(v)); }catch(e){} }
best = loadBest();
document.getElementById('bestNum').textContent = best;

function resetState(){
  const cx = Math.floor(COLS/2), cy = Math.floor(ROWS/2);
  snake = [{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy}];
  dir = {x:1,y:0}; nextDir = {x:1,y:0};
  score = 0; tickMs = 220;
  food = randomFood();
  document.getElementById('scoreNum').textContent = score;
}

function randomFood(){
  let p;
  do{ p = {x:Math.floor(Math.random()*COLS), y:Math.floor(Math.random()*ROWS)}; }
  while(snake.some(s=>s.x===p.x && s.y===p.y));
  return p;
}

function setDir(x,y){
  if(!running) return;
  if(snake.length>1 && dir.x===-x && dir.y===-y) return;
  nextDir = {x,y};
}

document.getElementById('btnUp').onclick = ()=>setDir(0,-1);
document.getElementById('btnDown').onclick = ()=>setDir(0,1);
document.getElementById('btnLeft').onclick = ()=>setDir(-1,0);
document.getElementById('btnRight').onclick = ()=>setDir(1,0);
window.addEventListener('keydown', (e)=>{
  const k = e.key;
  if(k==='ArrowUp'||k==='w') setDir(0,-1);
  else if(k==='ArrowDown'||k==='s') setDir(0,1);
  else if(k==='ArrowLeft'||k==='a') setDir(-1,0);
  else if(k==='ArrowRight'||k==='d') setDir(1,0);
});

function tick(){
  dir = nextDir;
  const head = {x: snake[0].x+dir.x, y: snake[0].y+dir.y};
  if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS || snake.some(s=>s.x===head.x&&s.y===head.y)){
    return gameOver();
  }
  snake.unshift(head);
  if(head.x===food.x && head.y===food.y){
    score++; playEat();
    document.getElementById('scoreNum').textContent = score;
    food = randomFood();
    if(tickMs > 110){ tickMs -= 4; restartTimer(); }
  } else {
    snake.pop();
  }
  draw();
}

function restartTimer(){
  clearInterval(timer);
  timer = setInterval(tick, tickMs);
}

function draw(){
  ctx2d.clearRect(0,0,PX_W,PX_H);
  ctx2d.fillStyle = '#DDF3D8';
  ctx2d.fillRect(0,0,PX_W,PX_H);
  if(!food || !snake) return;
  ctx2d.font = (CELL-2) + 'px serif';
  ctx2d.textAlign = 'center'; ctx2d.textBaseline = 'middle';
  ctx2d.fillText('🍎', food.x*CELL+CELL/2, food.y*CELL+CELL/2+1);
  snake.forEach((s,i)=>{
    ctx2d.fillStyle = i===0 ? '#FF8B67' : '#FFB199';
    const pad = 2;
    roundRect(ctx2d, s.x*CELL+pad, s.y*CELL+pad, CELL-pad*2, CELL-pad*2, 6);
    ctx2d.fill();
  });
}
function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

function startGame(){
  resetState();
  running = true;
  playStart();
  document.getElementById('startOverlay').style.display='none';
  document.getElementById('overOverlay').style.display='none';
  draw();
  clearInterval(timer);
  timer = setInterval(tick, tickMs);
}

function gameOver(){
  running = false;
  clearInterval(timer);
  playOver();
  if(score > best){ best = score; saveBest(best); document.getElementById('bestNum').textContent = best; }
  document.getElementById('overStats').textContent = `Você comeu ${score} maçã${score===1?'':'s'}!`;
  document.getElementById('overOverlay').style.display='flex';
}

document.getElementById('startBtn').onclick = startGame;
document.getElementById('restartBtn').onclick = startGame;

fitBoard();
resetState();
draw();
</script>
</body>
</html>

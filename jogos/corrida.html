<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Jogo de Corrida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#EAF4FB; --card:#FFFFFF; --coral:#FF8B67; --yellow:#FFD166;
    --mint:#06D6A0; --plum:#3D348B; --plum-soft:#6C63AC; --ink:#2C2A4A;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0; height:100vh; height:100svh; overflow:hidden;
    background:
      radial-gradient(circle at 12% 15%, #DCEEFB 0%, transparent 40%),
      radial-gradient(circle at 88% 80%, #FDE9DC 0%, transparent 45%),
      var(--sky);
    font-family:'Quicksand', sans-serif; color:var(--ink);
    display:flex; flex-direction:column; align-items:center;
    padding:8px 10px; touch-action:none;
  }
  h1,h2,.display{ font-family:'Baloo 2', cursive; }
  .app{ width:100%; max-width:360px; height:100%; display:flex; flex-direction:column; min-height:0; }
  .topnav{ display:flex; align-items:center; margin-bottom:4px; flex:0 0 auto; }
  .backbtn{ width:36px; height:36px; border-radius:50%; background:white; display:flex; align-items:center; justify-content:center; font-size:1.1rem; color:var(--plum); text-decoration:none; box-shadow:0 4px 10px rgba(61,52,139,0.12); }
  header.top{ text-align:center; margin-bottom:4px; flex:0 0 auto; }
  header.top h1{ font-size:1.05rem; color:var(--plum); margin:0; }
  header.top p{ margin:0; color:var(--plum-soft); font-weight:600; font-size:0.72rem; }
  .stats{ display:flex; justify-content:space-around; margin-bottom:6px; flex:0 0 auto; }
  .stat{ text-align:center; }
  .stat .num{ font-family:'Baloo 2', cursive; font-size:1rem; color:var(--coral); line-height:1.1; }
  .stat .lbl{ font-size:0.65rem; color:var(--plum-soft); font-weight:600; }
  .board-wrap{ flex:1 1 auto; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .board-box{ position:relative; border-radius:18px; overflow:hidden; box-shadow:0 14px 30px rgba(61,52,139,0.14); }
  canvas{ width:100%; height:100%; display:block; }
  .overlay{
    position:absolute; inset:0; background:rgba(61,52,139,0.6); display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; color:white; padding:14px;
  }
  .overlay .big-emoji{ font-size:2.2rem; margin-bottom:2px; }
  .overlay h2{ margin:2px 0; font-size:1.05rem; }
  .overlay p{ margin:0 0 8px; font-weight:600; font-size:0.8rem; }
  button.btn{ font-family:'Baloo 2', cursive; font-size:0.9rem; border:none; border-radius:14px; padding:9px 18px; cursor:pointer; transition:transform .15s ease; }
  button.btn:active{ transform:scale(0.96); }
  .btn-primary{ background:var(--coral); color:white; }
  .ctrls{ display:flex; justify-content:center; gap:20px; margin-top:8px; flex:0 0 auto; }
  .cbtn{ width:60px; height:60px; border-radius:50%; background:white; border:none; font-size:1.5rem; box-shadow:0 6px 14px rgba(61,52,139,0.12); color:var(--plum); cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .cbtn:active{ transform:scale(0.92); background:#F0EEFC; }

  @media (orientation:landscape) and (max-height:520px){
    .app{ flex-direction:row; align-items:stretch; max-width:100%; gap:10px; }
    .hud{ flex:0 0 auto; width:78px; display:flex; flex-direction:column; justify-content:flex-start; }
    header.top p{ display:none; }
    header.top h1{ font-size:0.82rem; }
    .stats{ flex-direction:column; gap:4px; }
    .board-wrap{ flex:1 1 auto; }
    .ctrls{ flex-direction:column; flex:0 0 auto; align-self:center; margin:0; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="hud">
  <div class="topnav"><a href="../menu.html" class="backbtn" aria-label="Voltar ao menu">⬅</a></div>
  <header class="top">
    <h1>🏎️ Jogo de Corrida</h1>
    <p>Desvie dos outros carrinhos!</p>
  </header>

  <div class="stats">
    <div class="stat"><div class="num" id="scoreNum">0</div><div class="lbl">Pontos</div></div>
    <div class="stat"><div class="num" id="bestNum">0</div><div class="lbl">Recorde</div></div>
  </div>
  </div>

  <div class="board-wrap" id="boardWrap">
    <div class="board-box" id="boardBox">
      <canvas id="board" width="300" height="500"></canvas>
      <div class="overlay" id="startOverlay">
        <div class="big-emoji">🏎️</div>
        <h2>Pronto pra correr?</h2>
        <p>Use as setinhas para desviar</p>
        <button class="btn btn-primary" id="startBtn">Começar 🚦</button>
      </div>
      <div class="overlay" id="overOverlay" style="display:none;">
        <div class="big-emoji">😊</div>
        <h2>Bateu! Vamos de novo?</h2>
        <p id="overStats"></p>
        <button class="btn btn-primary" id="restartBtn">Jogar de novo 🔄</button>
      </div>
    </div>
  </div>

  <div class="ctrls">
    <button class="cbtn" id="btnLeft">⬅️</button>
    <button class="cbtn" id="btnRight">➡️</button>
  </div>
</div>

<script>
let audioCtx = null;
function getAudioCtx(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } } if(audioCtx.state==='suspended'){ audioCtx.resume(); } return audioCtx; }
function playTone(freq, startTime, duration, type, peakGain){
  const ctx = getAudioCtx(); if(!ctx) return;
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type || 'triangle'; osc.frequency.value = freq;
  const t0 = ctx.currentTime + startTime;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peakGain || 0.14, t0 + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + duration + 0.02);
}
function playPoint(){ playTone(740, 0, 0.08, 'triangle', 0.08); }
function playStart(){ [392,587.33].forEach((f,i)=> playTone(f, i*0.09, 0.2, 'triangle', 0.13)); }
function playOver(){ [392,330,262].forEach((f,i)=> playTone(f, i*0.12, 0.22, 'sine', 0.11)); }

const canvas = document.getElementById('board');
const ctx2d = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const RATIO = W / H;
const boardWrap = document.getElementById('boardWrap');
const boardBox = document.getElementById('boardBox');

function fitBoard(){
  const availW = boardWrap.clientWidth;
  const availH = boardWrap.clientHeight;
  let h = availH;
  let w = h * RATIO;
  if(w > availW){ w = availW; h = w / RATIO; }
  w = Math.max(90, Math.floor(w));
  h = Math.max(150, Math.floor(h));
  boardBox.style.width = w + 'px';
  boardBox.style.height = h + 'px';
}
window.addEventListener('resize', fitBoard);
window.addEventListener('orientationchange', fitBoard);

const GRASS = 20;
const ROAD_W = W - GRASS*2;
const LANE_W = ROAD_W / 3;
function laneCenterX(i){ return GRASS + LANE_W*(i+0.5); }

const CAR_W = 46, CAR_H = 78;
const PLAYER_Y = H - 110;

let playerLane, playerX, obstacles, score, best, elapsed, spawnAcc, spawnInterval, speed, running, lastTs, scoreAcc;

function loadBest(){ try{ return parseInt(localStorage.getItem('corrida_best')||'0'); }catch(e){ return 0; } }
function saveBest(v){ try{ localStorage.setItem('corrida_best', String(v)); }catch(e){} }
best = loadBest();
document.getElementById('bestNum').textContent = best;

function resetState(){
  playerLane = 1;
  playerX = laneCenterX(playerLane);
  obstacles = [];
  score = 0; scoreAcc = 0;
  elapsed = 0; spawnAcc = 0; spawnInterval = 1100;
  speed = 170;
  document.getElementById('scoreNum').textContent = score;
}

function moveLane(delta){
  if(!running) return;
  playerLane = Math.max(0, Math.min(2, playerLane + delta));
}
document.getElementById('btnLeft').onclick = ()=>moveLane(-1);
document.getElementById('btnRight').onclick = ()=>moveLane(1);
window.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowLeft'||e.key==='a') moveLane(-1);
  else if(e.key==='ArrowRight'||e.key==='d') moveLane(1);
});

function spawnObstacle(){
  const lane = Math.floor(Math.random()*3);
  const colors = ['#3D348B','#06D6A0','#FFD166'];
  obstacles.push({lane, y:-CAR_H, color: colors[Math.floor(Math.random()*colors.length)]});
}

function update(dt){
  elapsed += dt;
  scoreAcc += dt;
  if(scoreAcc >= 1){ scoreAcc -= 1; score += 1; playPoint(); document.getElementById('scoreNum').textContent = score; }

  speed = Math.min(320, 170 + elapsed*6);
  spawnInterval = Math.max(650, 1100 - elapsed*15);

  spawnAcc += dt*1000;
  if(spawnAcc >= spawnInterval){ spawnAcc = 0; spawnObstacle(); }

  const targetX = laneCenterX(playerLane);
  playerX += (targetX - playerX) * Math.min(1, dt*10);

  obstacles.forEach(o => o.y += speed*dt);
  obstacles = obstacles.filter(o => o.y < H + CAR_H);

  for(const o of obstacles){
    if(o.lane === playerLane){
      const oTop = o.y, oBot = o.y + CAR_H;
      const pTop = PLAYER_Y - CAR_H/2, pBot = PLAYER_Y + CAR_H/2;
      if(oBot > pTop && oTop < pBot){ gameOver(); return; }
    }
  }
}

function drawCar(x, y, color, isPlayer){
  ctx2d.save();
  ctx2d.translate(x, y);
  ctx2d.fillStyle = color;
  roundRect(ctx2d, -CAR_W/2, -CAR_H/2, CAR_W, CAR_H, 10);
  ctx2d.fill();
  ctx2d.fillStyle = 'rgba(255,255,255,0.55)';
  roundRect(ctx2d, -CAR_W/2+7, -CAR_H/2+10, CAR_W-14, 18, 5);
  ctx2d.fill();
  roundRect(ctx2d, -CAR_W/2+7, CAR_H/2-30, CAR_W-14, 18, 5);
  ctx2d.fill();
  if(isPlayer){
    ctx2d.font = '20px serif'; ctx2d.textAlign='center'; ctx2d.textBaseline='middle';
    ctx2d.fillText('🏎️', 0, 2);
  }
  ctx2d.restore();
}
function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

function draw(){
  ctx2d.clearRect(0,0,W,H);
  ctx2d.fillStyle = '#93D488';
  ctx2d.fillRect(0,0,W,H);
  ctx2d.fillStyle = '#5B5F7A';
  ctx2d.fillRect(GRASS,0,ROAD_W,H);
  // lane dashes
  ctx2d.strokeStyle = '#FFD166';
  ctx2d.lineWidth = 4;
  ctx2d.setLineDash([18,16]);
  const offset = (elapsed*speed*0.6) % 34;
  for(let i=1;i<3;i++){
    const x = GRASS + LANE_W*i;
    ctx2d.beginPath();
    ctx2d.moveTo(x, -34+offset);
    ctx2d.lineTo(x, H);
    ctx2d.stroke();
  }
  ctx2d.setLineDash([]);
  obstacles.forEach(o => drawCar(laneCenterX(o.lane), o.y + CAR_H/2, o.color, false));
  if(running) drawCar(playerX, PLAYER_Y, '#FF8B67', true);
}

function loop(ts){
  if(!running) return;
  if(!lastTs) lastTs = ts;
  const dt = Math.min(0.05, (ts - lastTs)/1000);
  lastTs = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

function startGame(){
  resetState();
  running = true; lastTs = 0;
  playStart();
  document.getElementById('startOverlay').style.display='none';
  document.getElementById('overOverlay').style.display='none';
  requestAnimationFrame(loop);
}

function gameOver(){
  running = false;
  playOver();
  if(score > best){ best = score; saveBest(best); document.getElementById('bestNum').textContent = best; }
  document.getElementById('overStats').textContent = `Você fez ${score} ponto${score===1?'':'s'}!`;
  document.getElementById('overOverlay').style.display='flex';
  draw();
}

document.getElementById('startBtn').onclick = startGame;
document.getElementById('restartBtn').onclick = startGame;

fitBoard();
resetState();
draw();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Jogo de Corrida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#EAF4FB; --card:#FFFFFF; --coral:#FF8B67; --yellow:#FFD166;
    --mint:#06D6A0; --plum:#3D348B; --plum-soft:#6C63AC; --ink:#2C2A4A;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0; height:100vh; height:100svh; overflow:hidden;
    background:
      radial-gradient(circle at 12% 15%, #DCEEFB 0%, transparent 40%),
      radial-gradient(circle at 88% 80%, #FDE9DC 0%, transparent 45%),
      var(--sky);
    font-family:'Quicksand', sans-serif; color:var(--ink);
    display:flex; flex-direction:column; align-items:center;
    padding:0; touch-action:none;
  }
  h1,h2,.display{ font-family:'Baloo 2', cursive; }
  .app{ width:100%; height:100%; display:flex; flex-direction:column; min-height:0; }

  .backbtn{
    width:32px; height:32px; border-radius:10px; background:white; border:3px solid #16214a;
    display:flex; align-items:center; justify-content:center; text-decoration:none;
    box-shadow:0 3px 0 #16214a; flex:0 0 auto; pointer-events:auto; transition:transform .1s ease, box-shadow .1s ease;
  }
  .backbtn:active{ transform:translateY(2px); box-shadow:none; }
  .fsbtn{ font-size:1rem; color:var(--plum); cursor:pointer; }
  .tc-arrow{ width:0; height:0; pointer-events:none; }
  .tc-arrow.left{ border-top:8px solid transparent; border-bottom:8px solid transparent; border-right:11px solid white; margin-left:-2px; }
  .tc-arrow.right{ border-top:8px solid transparent; border-bottom:8px solid transparent; border-left:11px solid white; margin-right:-2px; }
  .tc-arrow.dark.left{ border-right-color:#16214a; }

  .hud-overlay{
    position:absolute; z-index:4;
    top:calc(14px + env(safe-area-inset-top, 0px));
    left:calc(14px + env(safe-area-inset-left, 0px));
    right:calc(14px + env(safe-area-inset-right, 0px));
    display:flex; align-items:flex-start; justify-content:space-between; gap:6px; pointer-events:none;
  }
  .hud-left{ display:flex; align-items:center; gap:6px; pointer-events:none; }
  .hud-stats{ display:flex; align-items:center; gap:6px; pointer-events:none; }
  .hud-badge{
    display:flex; align-items:center; gap:5px; background:white; border-radius:999px; padding:5px 12px;
    box-shadow:0 3px 8px rgba(61,52,139,0.16); font-family:'Baloo 2', cursive; font-size:0.85rem; color:var(--plum);
    white-space:nowrap;
  }

  .board-wrap{ flex:1 1 auto; min-height:0; width:100%; overflow:hidden; }
  .board-box{ position:relative; width:100%; height:100%; overflow:hidden; }
  canvas{ width:100%; height:100%; display:block; }

  .touch-ctrls{ position:absolute; inset:0; pointer-events:none; }
  .tc-btn{
    position:absolute; border:3px solid #16214a; border-radius:13px; display:flex; align-items:center; justify-content:center;
    pointer-events:auto; -webkit-tap-highlight-color:transparent; user-select:none;
    transition:transform .1s ease, box-shadow .1s ease;
    background:linear-gradient(180deg, #4A8CFF 0%, #2F6FED 100%);
    box-shadow:0 4px 0 #16214a, 0 6px 12px rgba(0,0,0,0.25);
  }
  .tc-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #16214a; }
  #btnLeft, #btnRight{
    width:58px; height:58px; bottom:calc(24px + env(safe-area-inset-bottom, 0px));
  }
  #btnLeft{ left:calc(20px + env(safe-area-inset-left, 0px)); }
  #btnRight{ right:calc(20px + env(safe-area-inset-right, 0px)); }

  .overlay{
    position:absolute; inset:0; background:rgba(61,52,139,0.6); display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; color:white; padding:16px; z-index:10;
  }
  .overlay .big-emoji{ font-size:2.4rem; margin-bottom:2px; }
  .overlay h2{ margin:2px 0; font-size:1.15rem; }
  .overlay p{ margin:0 0 10px; font-weight:600; font-size:0.85rem; }
  button.btn{ font-family:'Baloo 2', cursive; font-size:0.95rem; border:none; border-radius:14px; padding:11px 20px; cursor:pointer; box-shadow:0 6px 14px rgba(61,52,139,0.25); transition:transform .12s ease; }
  button.btn:active{ transform:scale(0.96); }
  .btn-primary{ background:linear-gradient(180deg, #FFA588 0%, var(--coral) 100%); color:white; }
</style>
</head>
<body>
<div class="app">
  <div class="board-wrap" id="boardWrap">
    <div class="board-box" id="boardBox">
      <canvas id="board"></canvas>

      <div class="hud-overlay">
        <div class="hud-left">
          <a href="../menu.html" class="backbtn" aria-label="Voltar ao menu"><span class="tc-arrow left dark"></span></a>
          <button class="backbtn fsbtn" id="btnFullscreen" aria-label="Tela cheia" type="button">⛶</button>
        </div>
        <div class="hud-stats">
          <span class="hud-badge">🏁 <b id="scoreNum">0</b></span>
          <span class="hud-badge">🏆 <b id="bestNum">0</b></span>
        </div>
      </div>

      <div class="touch-ctrls">
        <button class="tc-btn" id="btnLeft"><span class="tc-arrow left"></span></button>
        <button class="tc-btn" id="btnRight"><span class="tc-arrow right"></span></button>
      </div>

      <div class="overlay" id="startOverlay">
        <div class="big-emoji">🏎️</div>
        <h2>Pronto pra correr?</h2>
        <p>Use as setinhas para desviar</p>
        <button class="btn btn-primary" id="startBtn">Começar 🚦</button>
      </div>
      <div class="overlay" id="overOverlay" style="display:none;">
        <div class="big-emoji">😊</div>
        <h2>Bateu! Vamos de novo?</h2>
        <p id="overStats"></p>
        <button class="btn btn-primary" id="restartBtn">Jogar de novo 🔄</button>
      </div>
    </div>
  </div>
</div>

<script>
let audioCtx = null;
function getAudioCtx(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } } if(audioCtx.state==='suspended'){ audioCtx.resume(); } return audioCtx; }
function playTone(freq, startTime, duration, type, peakGain){
  const ctx = getAudioCtx(); if(!ctx) return;
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type || 'triangle'; osc.frequency.value = freq;
  const t0 = ctx.currentTime + startTime;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peakGain || 0.14, t0 + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + duration + 0.02);
}
function playPoint(){ playTone(740, 0, 0.08, 'triangle', 0.08); }
function playStart(){ [392,587.33].forEach((f,i)=> playTone(f, i*0.09, 0.2, 'triangle', 0.13)); }
function playOver(){ [392,330,262].forEach((f,i)=> playTone(f, i*0.12, 0.22, 'sine', 0.11)); }

const canvas = document.getElementById('board');
const ctx2d = canvas.getContext('2d');
let W = 300;
const H = 560;
const boardWrap = document.getElementById('boardWrap');
const boardBox = document.getElementById('boardBox');

function fitBoard(){
  const pxW = boardBox.clientWidth, pxH = boardBox.clientHeight;
  if(pxW <= 0 || pxH <= 0) return;
  const newW = Math.max(240, Math.round(H * (pxW / pxH)));
  if(newW !== W){ W = newW; canvas.width = W; }
  canvas.height = H;
}
window.addEventListener('resize', fitBoard);
window.addEventListener('orientationchange', fitBoard);

const fsBtn = document.getElementById('btnFullscreen');
const fsTarget = document.documentElement;
function isFullscreen(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function isIOS(){ return /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function isStandalone(){ return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; }
function toggleFullscreen(){
  const req = fsTarget.requestFullscreen || fsTarget.webkitRequestFullscreen;
  if(req){
    if(!isFullscreen()){ req.call(fsTarget); }
    else { const exit = document.exitFullscreen || document.webkitExitFullscreen; if(exit) exit.call(document); }
    return;
  }
  if(isIOS() && !isStandalone()){
    alert('No iPhone: toque no botao de compartilhar do Safari e escolha "Adicionar a Tela de Inicio". Assim o jogo abre em tela cheia.');
  }
}
fsBtn.addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', () => setTimeout(fitBoard, 60));
document.addEventListener('webkitfullscreenchange', () => setTimeout(fitBoard, 60));

const ROAD_W = 260;
function roadLeft(){ return (W - ROAD_W)/2; }
const LANE_W = ROAD_W / 3;
function laneCenterX(i){ return roadLeft() + LANE_W*(i+0.5); }

const CAR_W = 46, CAR_H = 78;
const PLAYER_Y = H - 130;

let playerLane, playerX, obstacles, score, best, elapsed, spawnAcc, spawnInterval, speed, running, lastTs, scoreAcc;

function loadBest(){ try{ return parseInt(localStorage.getItem('corrida_best')||'0'); }catch(e){ return 0; } }
function saveBest(v){ try{ localStorage.setItem('corrida_best', String(v)); }catch(e){} }
best = loadBest();
document.getElementById('bestNum').textContent = best;

function resetState(){
  playerLane = 1;
  playerX = laneCenterX(playerLane);
  obstacles = [];
  score = 0; scoreAcc = 0;
  elapsed = 0; spawnAcc = 0; spawnInterval = 1100;
  speed = 170;
  document.getElementById('scoreNum').textContent = score;
}

function moveLane(delta){
  if(!running) return;
  playerLane = Math.max(0, Math.min(2, playerLane + delta));
}
document.getElementById('btnLeft').addEventListener('click', ()=>moveLane(-1));
document.getElementById('btnRight').addEventListener('click', ()=>moveLane(1));
window.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowLeft'||e.key==='a') moveLane(-1);
  else if(e.key==='ArrowRight'||e.key==='d') moveLane(1);
});

function spawnObstacle(){
  const lane = Math.floor(Math.random()*3);
  const colors = ['#3D348B','#06D6A0','#FFD166'];
  obstacles.push({lane, y:-CAR_H, color: colors[Math.floor(Math.random()*colors.length)]});
}

function update(dt){
  elapsed += dt;
  scoreAcc += dt;
  if(scoreAcc >= 1){ scoreAcc -= 1; score += 1; playPoint(); document.getElementById('scoreNum').textContent = score; }

  speed = Math.min(320, 170 + elapsed*6);
  spawnInterval = Math.max(650, 1100 - elapsed*15);

  spawnAcc += dt*1000;
  if(spawnAcc >= spawnInterval){ spawnAcc = 0; spawnObstacle(); }

  const targetX = laneCenterX(playerLane);
  playerX += (targetX - playerX) * Math.min(1, dt*10);

  obstacles.forEach(o => o.y += speed*dt);
  obstacles = obstacles.filter(o => o.y < H + CAR_H);

  for(const o of obstacles){
    if(o.lane === playerLane){
      const oTop = o.y, oBot = o.y + CAR_H;
      const pTop = PLAYER_Y - CAR_H/2, pBot = PLAYER_Y + CAR_H/2;
      if(oBot > pTop && oTop < pBot){ gameOver(); return; }
    }
  }
}

function drawCar(x, y, color, isPlayer){
  ctx2d.save();
  ctx2d.translate(x, y);
  const w = CAR_W, h = CAR_H;

  ctx2d.fillStyle = '#1a1a1a';
  const wheelW = 9, wheelH = 19;
  roundRect(ctx2d, -w/2-5, -h/2+10, wheelW, wheelH, 3); ctx2d.fill();
  roundRect(ctx2d, w/2-wheelW+5, -h/2+10, wheelW, wheelH, 3); ctx2d.fill();
  roundRect(ctx2d, -w/2-5, h/2-10-wheelH, wheelW, wheelH, 3); ctx2d.fill();
  roundRect(ctx2d, w/2-wheelW+5, h/2-10-wheelH, wheelW, wheelH, 3); ctx2d.fill();

  ctx2d.fillStyle = color;
  roundRect(ctx2d, -w/2, -h/2, w, h, 15);
  ctx2d.fill();

  ctx2d.fillStyle = 'rgba(215,238,252,0.92)';
  roundRect(ctx2d, -w/2+7, -h/2+13, w-14, h*0.26, 7);
  ctx2d.fill();
  ctx2d.fillStyle = 'rgba(215,238,252,0.75)';
  roundRect(ctx2d, -w/2+7, h/2-13-h*0.15, w-14, h*0.15, 6);
  ctx2d.fill();

  ctx2d.fillStyle = '#FFEFA8';
  roundRect(ctx2d, -w/2+4, -h/2+2, 9, 5, 2); ctx2d.fill();
  roundRect(ctx2d, w/2-13, -h/2+2, 9, 5, 2); ctx2d.fill();
  ctx2d.fillStyle = '#E8483A';
  roundRect(ctx2d, -w/2+4, h/2-7, 9, 5, 2); ctx2d.fill();
  roundRect(ctx2d, w/2-13, h/2-7, 9, 5, 2); ctx2d.fill();

  if(isPlayer){
    ctx2d.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx2d.lineWidth = 2;
    roundRect(ctx2d, -w/2, -h/2, w, h, 15);
    ctx2d.stroke();
  }
  ctx2d.restore();
}
function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

function draw(){
  ctx2d.clearRect(0,0,W,H);
  ctx2d.fillStyle = '#93D488';
  ctx2d.fillRect(0,0,W,H);
  const rl = roadLeft();
  ctx2d.fillStyle = '#5B5F7A';
  ctx2d.fillRect(rl,0,ROAD_W,H);
  // lane dashes
  ctx2d.strokeStyle = '#FFD166';
  ctx2d.lineWidth = 4;
  ctx2d.setLineDash([18,16]);
  const offset = (elapsed*speed*0.6) % 34;
  for(let i=1;i<3;i++){
    const x = rl + LANE_W*i;
    ctx2d.beginPath();
    ctx2d.moveTo(x, -34+offset);
    ctx2d.lineTo(x, H);
    ctx2d.stroke();
  }
  ctx2d.setLineDash([]);
  obstacles.forEach(o => drawCar(laneCenterX(o.lane), o.y + CAR_H/2, o.color, false));
  if(running) drawCar(playerX, PLAYER_Y, '#FF8B67', true);
}

function loop(ts){
  if(!running) return;
  if(!lastTs) lastTs = ts;
  const dt = Math.min(0.05, (ts - lastTs)/1000);
  lastTs = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

function startGame(){
  resetState();
  running = true; lastTs = 0;
  playStart();
  document.getElementById('startOverlay').style.display='none';
  document.getElementById('overOverlay').style.display='none';
  requestAnimationFrame(loop);
}

function gameOver(){
  running = false;
  playOver();
  if(score > best){ best = score; saveBest(best); document.getElementById('bestNum').textContent = best; }
  document.getElementById('overStats').textContent = `Você fez ${score} ponto${score===1?'':'s'}!`;
  document.getElementById('overOverlay').style.display='flex';
  draw();
}

document.getElementById('startBtn').onclick = startGame;
document.getElementById('restartBtn').onclick = startGame;

fitBoard();
resetState();
draw();
</script>
</body>
</html>

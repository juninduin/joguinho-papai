<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Jogo da Velha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#EAF4FB; --card:#FFFFFF; --coral:#FF8B67; --yellow:#FFD166;
    --mint:#06D6A0; --plum:#3D348B; --plum-soft:#6C63AC; --ink:#2C2A4A;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0; height:100vh; height:100svh; overflow:hidden;
    background:
      radial-gradient(circle at 12% 15%, #DCEEFB 0%, transparent 40%),
      radial-gradient(circle at 88% 80%, #FDE9DC 0%, transparent 45%),
      var(--sky);
    font-family:'Quicksand', sans-serif; color:var(--ink);
    display:flex; flex-direction:column; align-items:center;
    padding:10px 12px;
  }
  h1,h2,.display{ font-family:'Baloo 2', cursive; }
  .app{ width:100%; max-width:400px; height:100%; display:flex; flex-direction:column; min-height:0; }
  .topnav{ display:flex; align-items:center; margin-bottom:6px; flex:0 0 auto; }
  .backbtn{ width:38px; height:38px; border-radius:50%; background:white; display:flex; align-items:center; justify-content:center; font-size:1.15rem; color:var(--plum); text-decoration:none; box-shadow:0 4px 10px rgba(61,52,139,0.12); }
  header.top{ text-align:center; margin-bottom:8px; flex:0 0 auto; }
  header.top h1{ font-size:1.2rem; color:var(--plum); margin:0 0 2px; }
  header.top p{ margin:0; color:var(--plum-soft); font-weight:600; font-size:0.8rem; }
  .modes{ display:flex; gap:8px; margin-bottom:10px; flex:0 0 auto; }
  .mode-btn{
    flex:1; border:2px solid #E4DFF5; background:#F8F7FD; color:var(--plum-soft);
    font-family:'Baloo 2',cursive; font-weight:700; font-size:0.8rem; border-radius:12px;
    padding:9px 4px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .mode-btn.active{ background:var(--coral); border-color:var(--coral); color:white; }
  .scores{ display:flex; justify-content:space-around; margin-bottom:8px; flex:0 0 auto; }
  .stat{ text-align:center; }
  .stat .num{ font-family:'Baloo 2', cursive; font-size:1.1rem; }
  .stat.x .num{ color:var(--coral); }
  .stat.o .num{ color:var(--plum); }
  .stat.d .num{ color:var(--plum-soft); }
  .stat .lbl{ font-size:0.65rem; color:var(--plum-soft); font-weight:600; }
  .turn{ text-align:center; font-family:'Baloo 2', cursive; color:var(--plum); font-size:0.95rem; margin-bottom:8px; flex:0 0 auto; }
  .board-wrap{ flex:1 1 auto; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .board{
    display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:8px;
  }
  .cell{
    background:white; border:none; border-radius:16px; box-shadow:0 6px 14px rgba(61,52,139,0.10);
    font-size:1em; font-family:'Baloo 2', cursive; cursor:pointer;
    display:flex; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent;
  }
  .cell.x{ color:var(--coral); }
  .cell.o{ color:var(--plum); }
  .cell.win{ background:#E3FBF3; }
  .overlay{
    position:fixed; inset:0; background:rgba(61,52,139,0.55); display:none; align-items:center; justify-content:center; padding:20px; z-index:10;
  }
  .overlay.show{ display:flex; }
  .win-card{ background:white; border-radius:24px; padding:26px 22px; text-align:center; max-width:320px; box-shadow:0 20px 40px rgba(0,0,0,0.2); }
  .win-card .big-emoji{ font-size:2.6rem; }
  button.btn{ font-family:'Baloo 2', cursive; font-size:0.95rem; border:none; border-radius:16px; padding:11px 20px; cursor:pointer; transition:transform .15s ease; margin-top:12px; }
  button.btn:active{ transform:scale(0.96); }
  .btn-primary{ background:var(--coral); color:white; width:100%; }
</style>
</head>
<body>
<div class="app">
  <div class="topnav"><a href="../menu.html" class="backbtn" aria-label="Voltar ao menu">⬅</a></div>
  <header class="top">
    <h1>⭕ Jogo da Velha</h1>
    <p>Alinhe três em linha, coluna ou diagonal!</p>
  </header>

  <div class="modes">
    <button class="mode-btn active" id="modePvp">👫 2 Jogadores</button>
    <button class="mode-btn" id="modeCpu">🤖 Computador</button>
  </div>

  <div class="scores">
    <div class="stat x"><div class="num" id="scoreX">0</div><div class="lbl">❌ Vitórias</div></div>
    <div class="stat d"><div class="num" id="scoreD">0</div><div class="lbl">🤝 Empates</div></div>
    <div class="stat o"><div class="num" id="scoreO">0</div><div class="lbl">⭕ Vitórias</div></div>
  </div>

  <div class="turn" id="turnText">Vez do ❌</div>

  <div class="board-wrap" id="boardWrap">
    <div class="board" id="board"></div>
  </div>
</div>

<div class="overlay" id="winOverlay">
  <div class="win-card">
    <div class="big-emoji" id="winEmoji">🎉</div>
    <h2 id="winText">Deu velha!</h2>
    <button class="btn btn-primary" id="playAgainBtn">Jogar de novo 🔄</button>
  </div>
</div>

<script>
let audioCtx = null;
function getAudioCtx(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } } if(audioCtx.state==='suspended'){ audioCtx.resume(); } return audioCtx; }
function playTone(freq, startTime, duration, type, peakGain){
  const ctx = getAudioCtx(); if(!ctx) return;
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type || 'triangle'; osc.frequency.value = freq;
  const t0 = ctx.currentTime + startTime;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peakGain || 0.14, t0 + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + duration + 0.02);
}
function playPlace(){ playTone(600, 0, 0.09, 'triangle', 0.1); }
function playWin(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=> playTone(f, i*0.09, 0.22, 'triangle', 0.13)); }
function playDraw(){ playTone(300, 0, 0.25, 'sine', 0.09); }

const WIN_LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

let board = Array(9).fill(null);
let current = 'X';
let mode = 'pvp';
let over = false;
let scores = {X:0,O:0,D:0};

const boardWrap = document.getElementById('boardWrap');
const boardEl = document.getElementById('board');
function fitBoard(){
  const size = Math.max(180, Math.floor(Math.min(boardWrap.clientWidth, boardWrap.clientHeight)));
  boardEl.style.width = size + 'px';
  boardEl.style.height = size + 'px';
  boardEl.style.fontSize = Math.floor(size/3*0.42) + 'px';
}
window.addEventListener('resize', fitBoard);
window.addEventListener('orientationchange', fitBoard);

function loadScores(){ try{ return JSON.parse(localStorage.getItem('velha_scores')||'{}'); }catch(e){ return {}; } }
function saveScores(){ try{ localStorage.setItem('velha_scores', JSON.stringify(scores)); }catch(e){} }
scores = { X:0, O:0, D:0, ...loadScores() };
updateScoreUI();

function updateScoreUI(){
  document.getElementById('scoreX').textContent = scores.X;
  document.getElementById('scoreO').textContent = scores.O;
  document.getElementById('scoreD').textContent = scores.D;
}

function checkResult(b){
  for(const line of WIN_LINES){
    const [a,c,d] = line;
    if(b[a] && b[a]===b[c] && b[a]===b[d]) return { winner:b[a], line };
  }
  if(b.every(v=>v)) return { winner:'draw' };
  return null;
}

function renderBoard(winLine){
  const el = document.getElementById('board');
  el.innerHTML = '';
  board.forEach((v,i)=>{
    const btn = document.createElement('button');
    btn.className = 'cell' + (v ? ' '+v.toLowerCase() : '') + (winLine && winLine.includes(i) ? ' win' : '');
    btn.textContent = v==='X' ? '❌' : v==='O' ? '⭕' : '';
    btn.onclick = ()=> cellClick(i);
    el.appendChild(btn);
  });
}

function updateTurnText(){
  const label = current==='X' ? '❌' : (mode==='cpu' ? '🤖' : '⭕');
  document.getElementById('turnText').textContent = 'Vez do ' + label;
}

function cellClick(i){
  if(over || board[i]) return;
  if(mode==='cpu' && current==='O') return;
  place(i, current);
}

function place(i, player){
  board[i] = player;
  playPlace();
  const result = checkResult(board);
  if(result){
    renderBoard(result.line);
    endGame(result);
    return;
  }
  renderBoard();
  current = current==='X' ? 'O' : 'X';
  updateTurnText();
  if(mode==='cpu' && current==='O' && !over){
    setTimeout(cpuMove, 450);
  }
}

function emptyCells(){ return board.map((v,i)=>v?null:i).filter(i=>i!==null); }

function pickCpuMove(){
  for(const i of emptyCells()){
    const copy = [...board]; copy[i]='O';
    if(checkResult(copy) && checkResult(copy).winner==='O') return i;
  }
  for(const i of emptyCells()){
    const copy = [...board]; copy[i]='X';
    if(checkResult(copy) && checkResult(copy).winner==='X') return i;
  }
  if(!board[4]) return 4;
  const corners = [0,2,6,8].filter(i=>!board[i]);
  if(corners.length) return corners[Math.floor(Math.random()*corners.length)];
  const rest = emptyCells();
  return rest[Math.floor(Math.random()*rest.length)];
}

function cpuMove(){
  if(over) return;
  place(pickCpuMove(), 'O');
}

function endGame(result){
  over = true;
  if(result.winner==='draw'){
    scores.D++;
    playDraw();
    document.getElementById('winEmoji').textContent = '🤝';
    document.getElementById('winText').textContent = 'Deu velha!';
  } else {
    scores[result.winner]++;
    playWin();
    const label = result.winner==='X' ? '❌' : (mode==='cpu' ? '🤖' : '⭕');
    document.getElementById('winEmoji').textContent = '🎉';
    document.getElementById('winText').textContent = `${label} venceu!`;
  }
  updateScoreUI();
  saveScores();
  setTimeout(()=>{ document.getElementById('winOverlay').classList.add('show'); }, 500);
}

function newRound(){
  board = Array(9).fill(null);
  current = 'X';
  over = false;
  document.getElementById('winOverlay').classList.remove('show');
  renderBoard();
  updateTurnText();
}

document.getElementById('modePvp').onclick = ()=>{
  mode='pvp';
  document.getElementById('modePvp').classList.add('active');
  document.getElementById('modeCpu').classList.remove('active');
  newRound();
};
document.getElementById('modeCpu').onclick = ()=>{
  mode='cpu';
  document.getElementById('modeCpu').classList.add('active');
  document.getElementById('modePvp').classList.remove('active');
  newRound();
};
document.getElementById('playAgainBtn').onclick = newRound;

fitBoard();
renderBoard();
updateTurnText();
</script>
</body>
</html>

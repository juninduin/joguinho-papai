<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Labirinto Divertido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#EAF4FB; --card:#FFFFFF; --coral:#FF8B67; --yellow:#FFD166;
    --mint:#06D6A0; --plum:#3D348B; --plum-soft:#6C63AC; --ink:#2C2A4A;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0; height:100vh; height:100svh; overflow:hidden;
    background:
      radial-gradient(circle at 12% 15%, #DCEEFB 0%, transparent 40%),
      radial-gradient(circle at 88% 80%, #FDE9DC 0%, transparent 45%),
      var(--sky);
    font-family:'Quicksand', sans-serif; color:var(--ink);
    display:flex; flex-direction:column; align-items:center;
    padding:0; touch-action:none;
  }
  h1,h2,.display{ font-family:'Fredoka','Baloo 2', cursive; }
  .app{ width:100%; height:100%; display:flex; flex-direction:column; min-height:0; }

  .backbtn{
    width:32px; height:32px; border-radius:10px; background:white; border:3px solid #16214a;
    display:flex; align-items:center; justify-content:center; text-decoration:none;
    box-shadow:0 3px 0 #16214a; flex:0 0 auto; pointer-events:auto; transition:transform .1s ease, box-shadow .1s ease;
  }
  .backbtn:active{ transform:translateY(2px); box-shadow:none; }
  .fsbtn{ font-size:1rem; color:var(--plum); cursor:pointer; }
  .tc-arrow{ width:0; height:0; pointer-events:none; }
  .tc-arrow.left{ border-top:8px solid transparent; border-bottom:8px solid transparent; border-right:11px solid white; margin-left:-2px; }
  .tc-arrow.dark.left{ border-right-color:#16214a; }

  .hud-overlay{
    position:absolute; z-index:4;
    top:calc(14px + env(safe-area-inset-top, 0px));
    left:calc(14px + env(safe-area-inset-left, 0px));
    right:calc(14px + env(safe-area-inset-right, 0px));
    display:flex; align-items:flex-start; justify-content:space-between; gap:6px; pointer-events:none;
  }
  .hud-left{ display:flex; align-items:center; gap:6px; pointer-events:none; }
  .hud-stats{ display:flex; align-items:center; gap:6px; pointer-events:none; }
  .hud-badge{
    display:flex; align-items:center; gap:5px; background:white; border-radius:999px; padding:5px 12px;
    box-shadow:0 3px 8px rgba(61,52,139,0.16); font-family:'Fredoka','Baloo 2', cursive; font-size:0.85rem; color:var(--plum);
    white-space:nowrap;
  }

  .board-wrap{ flex:1 1 auto; min-height:0; width:100%; overflow:hidden; }
  .board-box{
    position:relative; width:100%; height:100%; overflow:hidden; background:#FFF7E8;
    display:flex; align-items:center; justify-content:center; padding-bottom:178px;
  }
  @media (min-width:700px){ .board-box{ padding-bottom:0; padding-right:190px; } }
  canvas{ display:block; }

  .touch-ctrls{ position:absolute; inset:0; pointer-events:none; }
  .dpad{
    position:absolute; right:calc(20px + env(safe-area-inset-right, 0px)); bottom:calc(24px + env(safe-area-inset-bottom, 0px));
    display:grid; grid-template-columns:52px 52px 52px; grid-template-rows:52px 52px 52px; gap:6px;
  }
  .dbtn{
    background:linear-gradient(180deg, #FFFFFF 0%, #F0EEFC 100%); border:3px solid #16214a; border-radius:13px;
    font-size:1.3rem; box-shadow:0 4px 0 #16214a; cursor:pointer; color:var(--plum);
    -webkit-tap-highlight-color:transparent; pointer-events:auto; transition:transform .1s ease, box-shadow .1s ease;
  }
  .dbtn:active{ transform:translateY(3px); box-shadow:none; }
  .dup{ grid-column:2; grid-row:1; } .dleft{ grid-column:1; grid-row:2; }
  .dright{ grid-column:3; grid-row:2; } .ddown{ grid-column:2; grid-row:3; }

  .overlay{
    position:absolute; inset:0; background:rgba(61,52,139,0.6); display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; color:white; padding:16px; z-index:10;
  }
  .overlay .big-emoji{ font-size:2.4rem; margin-bottom:2px; }
  .overlay h2{ margin:2px 0; font-size:1.15rem; }
  .overlay p{ margin:0 0 10px; font-weight:600; font-size:0.85rem; max-width:320px; }
  button.btn{ font-family:'Fredoka','Baloo 2', cursive; font-size:0.9rem; border:none; border-radius:14px; padding:11px 20px; cursor:pointer; box-shadow:0 6px 14px rgba(61,52,139,0.25); transition:transform .12s ease; }
  button.btn:active{ transform:scale(0.96); }
  .btn-primary{ background:linear-gradient(180deg, #FFA588 0%, var(--coral) 100%); color:white; }
  .level-choices{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:6px; }
  .level-choices button{ color:white; min-width:110px; }
  #btnEasy{ background:linear-gradient(180deg, #3AE0AE 0%, var(--mint) 100%); }
  #btnMed{ background:linear-gradient(180deg, #FFDD8F 0%, var(--yellow) 100%); color:var(--ink); }
  #btnHard{ background:linear-gradient(180deg, #FFA588 0%, var(--coral) 100%); }
</style>
</head>
<body>
<div class="app">
  <div class="board-wrap" id="boardWrap">
    <div class="board-box" id="boardBox">
      <canvas id="board"></canvas>

      <div class="hud-overlay">
        <div class="hud-left">
          <a href="../menu.html" class="backbtn" aria-label="Voltar ao menu"><span class="tc-arrow left dark"></span></a>
          <button class="backbtn fsbtn" id="btnFullscreen" aria-label="Tela cheia" type="button">⛶</button>
        </div>
        <div class="hud-stats">
          <span class="hud-badge">🐰 Ache a cenoura!</span>
        </div>
      </div>

      <div class="touch-ctrls">
        <div class="dpad">
          <button class="dbtn dup" id="btnUp">⬆️</button>
          <button class="dbtn dleft" id="btnLeft">⬅️</button>
          <button class="dbtn dright" id="btnRight">➡️</button>
          <button class="dbtn ddown" id="btnDown">⬇️</button>
        </div>
      </div>

      <div class="overlay" id="startOverlay">
        <div class="big-emoji">🐰🥕</div>
        <h2>Labirinto Divertido</h2>
        <p>Ajude o coelhinho a encontrar a cenoura! Use as setas pra andar pelo labirinto. Não tem como perder, pode explorar à vontade!</p>
        <div class="level-choices">
          <button class="btn" id="btnEasy">⭐ Fácil</button>
          <button class="btn" id="btnMed">⭐⭐ Médio</button>
          <button class="btn" id="btnHard">⭐⭐⭐ Difícil</button>
        </div>
      </div>
      <div class="overlay" id="winOverlay" style="display:none;">
        <div class="big-emoji">🥕🎉</div>
        <h2>Você encontrou a cenoura!</h2>
        <p id="winStats"></p>
        <button class="btn btn-primary" id="restartBtn">Jogar de novo 🔄</button>
      </div>
    </div>
  </div>
</div>

<script>
let audioCtx = null;
function getAudioCtx(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } } if(audioCtx.state==='suspended'){ audioCtx.resume(); } return audioCtx; }
function playTone(freq, startTime, duration, type, peakGain){
  const ctx = getAudioCtx(); if(!ctx) return;
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type || 'triangle'; osc.frequency.value = freq;
  const t0 = ctx.currentTime + startTime;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peakGain || 0.14, t0 + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + duration + 0.02);
}
function playStep(){ playTone(500, 0, 0.06, 'triangle', 0.08); }
function playBlocked(){ playTone(180, 0, 0.08, 'sawtooth', 0.07); }
function playWin(){ [523,659,784,1047,1319].forEach((f,i)=> playTone(f, i*0.11, 0.26, 'triangle', 0.13)); }

const canvas = document.getElementById('board');
const ctx2d = canvas.getContext('2d');
const boardBox = document.getElementById('boardBox');

const LEVELS = { 1:{cols:7,rows:9}, 2:{cols:10,rows:13}, 3:{cols:13,rows:17} };
let level = 1;
let COLS = 7, ROWS = 9, CELL = 40;
let maze = [];
let player = {c:0, r:0};
let goal = {c:0, r:0};
let visited = [];
let running = false;

function fitBoard(){
  const wide = window.innerWidth >= 700;
  const w = boardBox.clientWidth - 16 - (wide ? 190 : 0);
  const h = boardBox.clientHeight - 16 - (wide ? 0 : 178);
  if(w <= 0 || h <= 0) return;
  CELL = Math.max(14, Math.floor(Math.min(w / COLS, h / ROWS)));
  canvas.width = CELL * COLS;
  canvas.height = CELL * ROWS;
  draw();
}
window.addEventListener('resize', fitBoard);
window.addEventListener('orientationchange', fitBoard);

const fsBtn = document.getElementById('btnFullscreen');
const fsTarget = document.documentElement;
function isFullscreen(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function isIOS(){ return /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function isStandalone(){ return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; }
function toggleFullscreen(){
  const req = fsTarget.requestFullscreen || fsTarget.webkitRequestFullscreen;
  if(req){
    if(!isFullscreen()){ req.call(fsTarget); }
    else { const exit = document.exitFullscreen || document.webkitExitFullscreen; if(exit) exit.call(document); }
    return;
  }
  if(isIOS() && !isStandalone()){
    alert('No iPhone: toque no botao de compartilhar do Safari e escolha "Adicionar a Tela de Inicio". Assim o jogo abre em tela cheia.');
  }
}
fsBtn.addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', () => setTimeout(fitBoard, 60));
document.addEventListener('webkitfullscreenchange', () => setTimeout(fitBoard, 60));

function generateMaze(cols, rows){
  const cells = [];
  for(let r=0;r<rows;r++){
    const row = [];
    for(let c=0;c<cols;c++) row.push({ top:true, right:true, bottom:true, left:true, seen:false });
    cells.push(row);
  }
  const stackArr = [{c:0,r:0}];
  cells[0][0].seen = true;
  while(stackArr.length){
    const cur = stackArr[stackArr.length-1];
    const neighbors = [];
    const dirs = [
      {dc:0, dr:-1, wall:'top', opp:'bottom'},
      {dc:1, dr:0, wall:'right', opp:'left'},
      {dc:0, dr:1, wall:'bottom', opp:'top'},
      {dc:-1, dr:0, wall:'left', opp:'right'}
    ];
    dirs.forEach(d => {
      const nc = cur.c + d.dc, nr = cur.r + d.dr;
      if(nc>=0 && nc<cols && nr>=0 && nr<rows && !cells[nr][nc].seen){
        neighbors.push({c:nc, r:nr, ...d});
      }
    });
    if(neighbors.length){
      const n = neighbors[Math.floor(Math.random()*neighbors.length)];
      cells[cur.r][cur.c][n.wall] = false;
      cells[n.r][n.c][n.opp] = false;
      cells[n.r][n.c].seen = true;
      stackArr.push({c:n.c, r:n.r});
    } else {
      stackArr.pop();
    }
  }
  return cells;
}

function newMaze(lvl){
  level = lvl;
  const cfg = LEVELS[lvl];
  COLS = cfg.cols; ROWS = cfg.rows;
  maze = generateMaze(COLS, ROWS);
  player = {c:0, r:0};
  goal = {c:COLS-1, r:ROWS-1};
  visited = Array.from({length:ROWS}, () => Array(COLS).fill(false));
  visited[0][0] = true;
  running = true;
  fitBoard();
}

function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

function draw(){
  if(!maze.length) return;
  const W = CELL*COLS, H = CELL*ROWS;
  ctx2d.clearRect(0,0,W,H);
  ctx2d.fillStyle = '#FFF7E8';
  ctx2d.fillRect(0,0,W,H);

  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      if(visited[r][c]){
        ctx2d.fillStyle = 'rgba(255,209,102,0.28)';
        ctx2d.fillRect(c*CELL, r*CELL, CELL, CELL);
      }
    }
  }

  ctx2d.fillStyle = '#DFF3E4';
  ctx2d.fillRect(goal.c*CELL, goal.r*CELL, CELL, CELL);

  ctx2d.strokeStyle = '#3D348B';
  ctx2d.lineWidth = Math.max(2, CELL*0.09);
  ctx2d.lineCap = 'round';
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const x = c*CELL, y = r*CELL;
      const cell = maze[r][c];
      ctx2d.beginPath();
      if(cell.top){ ctx2d.moveTo(x,y); ctx2d.lineTo(x+CELL,y); }
      if(cell.left){ ctx2d.moveTo(x,y); ctx2d.lineTo(x,y+CELL); }
      if(r===ROWS-1 && cell.bottom){ ctx2d.moveTo(x,y+CELL); ctx2d.lineTo(x+CELL,y+CELL); }
      if(c===COLS-1 && cell.right){ ctx2d.moveTo(x+CELL,y); ctx2d.lineTo(x+CELL,y+CELL); }
      ctx2d.stroke();
    }
  }

  const goalFont = Math.max(12, CELL*0.62);
  ctx2d.font = goalFont + 'px serif';
  ctx2d.textAlign = 'center'; ctx2d.textBaseline = 'middle';
  ctx2d.fillText('🥕', goal.c*CELL+CELL/2, goal.r*CELL+CELL/2+1);

  const playerFont = Math.max(12, CELL*0.68);
  ctx2d.font = playerFont + 'px serif';
  ctx2d.fillText('🐰', player.c*CELL+CELL/2, player.r*CELL+CELL/2+1);
}

function tryMove(dc, dr){
  if(!running) return;
  const cell = maze[player.r][player.c];
  let can = false;
  if(dc===0 && dr===-1 && !cell.top) can = true;
  else if(dc===1 && dr===0 && !cell.right) can = true;
  else if(dc===0 && dr===1 && !cell.bottom) can = true;
  else if(dc===-1 && dr===0 && !cell.left) can = true;

  if(!can){ playBlocked(); return; }

  player.c += dc; player.r += dr;
  visited[player.r][player.c] = true;
  playStep();
  draw();

  if(player.c === goal.c && player.r === goal.r){
    winGame();
  }
}

document.getElementById('btnUp').onclick = ()=> tryMove(0,-1);
document.getElementById('btnDown').onclick = ()=> tryMove(0,1);
document.getElementById('btnLeft').onclick = ()=> tryMove(-1,0);
document.getElementById('btnRight').onclick = ()=> tryMove(1,0);
window.addEventListener('keydown', (e)=>{
  const k = e.key;
  if(k==='ArrowUp'||k==='w') tryMove(0,-1);
  else if(k==='ArrowDown'||k==='s') tryMove(0,1);
  else if(k==='ArrowLeft'||k==='a') tryMove(-1,0);
  else if(k==='ArrowRight'||k==='d') tryMove(1,0);
});

let touchStartX=0, touchStartY=0;
canvas.addEventListener('touchstart', (e)=>{
  const t = e.changedTouches[0];
  touchStartX = t.clientX; touchStartY = t.clientY;
}, {passive:true});
canvas.addEventListener('touchend', (e)=>{
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX, dy = t.clientY - touchStartY;
  if(Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
  if(Math.abs(dx) > Math.abs(dy)) tryMove(dx>0?1:-1, 0);
  else tryMove(0, dy>0?1:-1);
}, {passive:true});

function startLevel(lvl){
  newMaze(lvl);
  document.getElementById('startOverlay').style.display = 'none';
  document.getElementById('winOverlay').style.display = 'none';
  draw();
}

function winGame(){
  running = false;
  playWin();
  const visitedCount = visited.flat().filter(Boolean).length;
  document.getElementById('winStats').textContent = `Você passou por ${visitedCount} caminhos até achar a cenoura!`;
  setTimeout(()=>{ document.getElementById('winOverlay').style.display = 'flex'; }, 500);
}

document.getElementById('btnEasy').onclick = ()=> startLevel(1);
document.getElementById('btnMed').onclick = ()=> startLevel(2);
document.getElementById('btnHard').onclick = ()=> startLevel(3);
document.getElementById('restartBtn').onclick = ()=> startLevel(level);

fitBoard();
</script>
</body>
</html>
